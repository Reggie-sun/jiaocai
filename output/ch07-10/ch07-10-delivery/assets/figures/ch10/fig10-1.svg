<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="330px" viewBox="0 0 900 330" role="img" aria-labelledby="title desc"><title id="title">图10-1 领导行为从方向到复核的责任循环</title><desc id="desc">沿“说明共同愿景—开放专业贡献—授权并提供资源—作出或暂缓决定”推进，再沿“结果与新证据”回到目标复核。每一步都检查事实、边界和责任；图中行为可随情境反复调整，不是固定性格类型。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="330" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><rect x="30" y="15" width="840" height="58" rx="8" fill="#F0F2F4" stroke="#555B61" stroke-width="2"/><text x="450" y="51" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#202326">事实、边界与责任贯穿各环节</text><rect x="20.0" y="120" width="194" height="110" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="117.0" y="154" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">共同方向</text><text x="117.0" y="186" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">说明愿景</text><text x="117.0" y="214" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">与结果标准</text><line x1="217.0" y1="175" x2="238.0" y2="175" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="117.0" y1="78" x2="117.0" y2="113" stroke="#555B61" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="242.0" y="120" width="194" height="110" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="339.0" y="154" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">专业贡献</text><text x="339.0" y="186" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">聆听、澄清</text><text x="339.0" y="214" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">客观表达</text><line x1="439.0" y1="175" x2="460.0" y2="175" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="339.0" y1="78" x2="339.0" y2="113" stroke="#555B61" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="464.0" y="120" width="194" height="110" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="561.0" y="154" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">授权与资源</text><text x="561.0" y="186" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">任务和权限</text><text x="561.0" y="214" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">支持与责任</text><line x1="661.0" y1="175" x2="682.0" y2="175" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="561.0" y1="78" x2="561.0" y2="113" stroke="#555B61" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="686.0" y="120" width="194" height="110" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="783.0" y="154" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">决定或暂缓</text><text x="783