<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="330px" viewBox="0 0 900 330" role="img" aria-labelledby="title desc"><title id="title">图8-3 从问题到可复查结论的信息筛选路径</title><desc id="desc">沿着“问题与版本—来源选择—主张定位—条件核验—保存记录”阅读；如果缺少原文或关键条件，沿回路补查或把结论留在待验证状态。不同箭头表示信息依赖，不是一次搜索后必须得出确定答案。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="330" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><rect x="30" y="15" width="840" height="58" rx="8" fill="#F0F2F4" stroke="#555B61" stroke-width="2"/><text x="450" y="51" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#202326">可复查的结论需要问题、出处、条件与当前证据</text><rect x="35.0" y="120" width="150" height="110" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="110.0" y="154" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">问题与版本</text><text x="110.0" y="186" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">明确要查什么</text><line x1="188.0" y1="175" x2="201.0" y2="175" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="110.0" y1="78" x2="110.0" y2="113" stroke="#555B61" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="205.0" y="120" width="150" height="110" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="280.0" y="154" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">来源选择</text><text x="280.0" y="186" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">找到原始材料</text><line x1="358.0" y1="175" x2="371.0" y2="175" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="280.0" y1="78" x2="280.0" y2="113" stroke="#555B61" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="375.0" y="120" width="150" height="110" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="154" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">主张定位</text><text x="450.0" y="186" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">指出支持位置</text><line x1="528.0" y1="175" x2="541.0" y2="175" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="450.0" y1="78" x2="450.0" y2="113" stroke="#555B61" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="545.0" y="120" width="150" height="110" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="620.0" y="154" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">条件核验</text><text x="620.0" y="186" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">比较适用条件</text><line x1="698.0" y1="175" x2="711.0" y2="175" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="620.0" y1="78" x2="620.0" y2="113" stroke="#555B61" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="715.0" y="120" width="150" height="110" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="790.0" y="154" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">保存记录</text><text x="790.0" y="186" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">可复查结论</text><line x1="790.0" y1="78" x2="790.0" y2="113" stroke="#555B61" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#arrow)"/><path d="M790.0 238 V265 H110.0 V238" fill="none" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="450" y="302" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">关键材料不足：补查，或保留“待验证”状态。</text></g></svg>