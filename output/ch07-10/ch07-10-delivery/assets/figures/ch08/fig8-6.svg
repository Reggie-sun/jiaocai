<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="480px" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">图8-6 IDP从计划到证据再到调整的循环</title><desc id="desc">从个人动机和能力起点开始，沿着目标、资源、练习、证据逐步前进；检查点把结果带回目标和资源选择。若证据显示任务过难或过易，调整的是目标范围、先备、练习或时间之一，并记录调整理由，而不是仅把进度百分比改高。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="480" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><rect x="25" y="35" width="210" height="105" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="130.0" y="69" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">动机与起点</text><text x="130.0" y="101" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">兴趣和当前表现</text><rect x="345" y="35" width="210" height="105" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="69" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">可检查的目标</text><text x="450.0" y="101" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">任务、条件与标准</text><rect x="665" y="35" width="210" height="105" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="770.0" y="69" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">资源与时间</text><text x="770.0" y="101" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">材料、先备与预算</text><rect x="665" y="245" width="210" height="105" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="770.0" y="279" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">练习</text><text x="770.0" y="311" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">执行具体学习活动</text><rect x="345" y="245" width="210" height="105" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="279" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">证据与检查点</text><text x="450.0" y="311" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">比较实际表现</text><rect x="25" y="245" width="210" height="105" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="130.0" y="279" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">调整与理由</text><text x="130.0" y="311" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">修改一个关键条件</text><line x1="240" y1="87" x2="340" y2="87" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="560" y1="87" x2="660" y2="87" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="770" y1="145" x2="770" y2="240" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="660" y1="297" x2="560" y2="297" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="340" y1="297" x2="240" y2="297" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M130 240 V190 H450 V145" fill="none" stroke="#555B61" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow)"/><path d="M450 190 H690 V145" fill="none" stroke="#555B61" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="450" y="404" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">改目标、先备、练习或时间，并保留调整依据。</text><text x="450" y="442" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">流程关系示意，不是实证效果模型。</text></g></svg>