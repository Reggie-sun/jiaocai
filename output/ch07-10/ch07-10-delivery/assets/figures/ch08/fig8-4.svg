<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="560px" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">图8-4 学习工具围绕任务形成的材料网络</title><desc id="desc">从“要完成的任务”向外观察目标记录、来源、提取练习、作品和反馈如何互相指向。箭头表示可以追踪的关系，不代表必须安装多个应用；若一项工具没有帮助完成或检查任务，可以删去该环节。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="560" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><line x1="450" y1="250" x2="450" y2="68" stroke="#555B61" stroke-width="2" stroke-linecap="round"/><line x1="450" y1="250" x2="155" y2="203" stroke="#555B61" stroke-width="2" stroke-linecap="round"/><line x1="450" y1="250" x2="745" y2="203" stroke="#555B61" stroke-width="2" stroke-linecap="round"/><line x1="450" y1="250" x2="250" y2="388" stroke="#555B61" stroke-width="2" stroke-linecap="round"/><line x1="450" y1="250" x2="650" y2="388" stroke="#555B61" stroke-width="2" stroke-linecap="round"/><rect x="320" y="20" width="260" height="95" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="54" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">目标记录</text><text x="450.0" y="86" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">计划与检查点</text><rect x="25" y="155" width="260" height="95" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="155.0" y="189" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">来源材料</text><text x="155.0" y="221" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">文档、论文与课程</text><rect x="615" y="155" width="260" height="95" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="745.0" y="189" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">提取练习</text><text x="745.0" y="221" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">问题、作答与修正</text><rect x="120" y="340" width="260" height="95" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="250.0" y="374" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">作品</text><text x="250.0" y="406" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">代码、解释与结果</text><rect x="520" y="340" width="260" height="95" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="650.0" y="374" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">反馈</text><text x="650.0" y="406" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">差距与下一次调整</text><rect x="320" y="195" width="260" height="105" rx="8" fill="#F0F2F4" stroke="#1F4E79" stroke-width="2"/><text x="450" y="238" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#202326">要完成的任务</text><text x="450" y="272" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#202326">及其表现证据</text><text x="450" y="490" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight=