<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="450px" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">图9-5 同伴支持与团队复盘的双向闭环</title><desc id="desc">左侧由识别阻碍进入支持行动，支持结果形成任务证据；右侧把证据带入复盘，复盘产生下一次可观察的流程调整，并回到新的共同任务。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="450" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="225" y="35" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="25px" font-weight="bold" fill="#202326">支持他人</text><text x="675" y="35" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="25px" font-weight="bold" fill="#202326">共同复盘</text><rect x="60" y="70" width="330" height="90" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="225.0" y="104" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">识别阻碍</text><text x="225.0" y="136" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">先备、资源与协作条件</text><rect x="60" y="215" width="330" height="90" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="225.0" y="249" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">支持行动</text><text x="225.0" y="281" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">解释、配对与调整任务</text><rect x="510" y="70" width="330" height="90" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="675.0" y="104" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">任务证据</text><text x="675.0" y="136" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">观察支持后的实际表现</text><rect x="510" y="215" width="330" height="90" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="675.0" y="249" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">流程调整</text><text x="675.0" y="281" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">明确下一次怎样验证</text><line x1="225" y1="165" x2="225" y2="210" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M395 260 H450 V115 H505" fill="none" stroke="#555B61" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><line x1="675" y1="165" x2="675" y2="210" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M675 310 V360 H20 V115 H55" fill="none" stroke="#555B61" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="450" y="410" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">新的共同任务检验调整，结果再成为支持与复盘的依据。</text></g></svg>