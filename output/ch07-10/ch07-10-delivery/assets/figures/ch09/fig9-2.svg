<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="640px" viewBox="0 0 900 640" role="img" aria-labelledby="title desc"><title id="title">图9-2 成果展任务的依赖关系与返回检查</title><desc id="desc">实线箭头表示后项必须等前项输出，虚线回箭头表示评审可能要求重新检查前项；并行的内容核对与字段结构准备都可从目标确认后开始，但页面整合需要两项结果齐备。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="640" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><rect x="320" y="20" width="260" height="90" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="54" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">确认目标</text><text x="450.0" y="86" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">范围与验收条件</text><rect x="70" y="160" width="320" height="95" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="230.0" y="194" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">内容核对</text><text x="230.0" y="226" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">来源、状态与读者任务</text><rect x="510" y="160" width="320" height="95" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="670.0" y="194" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">字段结构准备</text><text x="670.0" y="226" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">表示、输入与接口</text><rect x="320" y="320" width="260" height="90" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="354" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">页面整合</text><text x="450.0" y="386" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">两项输出均已齐备</text><rect x="320" y="465" width="260" height="90" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="499" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">评审</text><text x="450.0" y="531" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">检查行为与内容</text><path d="M450 115 V132 H230 V155" fill="none" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M450 132 H670 V155" fill="none" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M230 260 V293 H450 V315" fill="none" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M670 260 V293 H450" fill="none" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="450" y1="415" x2="450" y2="460" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M315 510 H25 V205 H65" fill="none" stroke="#555B61" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow)"/><path d="M585 510 H875 V205 H835" fill="none" stroke="#555B61" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6