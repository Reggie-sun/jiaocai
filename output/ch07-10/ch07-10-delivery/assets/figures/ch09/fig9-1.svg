<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="415px" viewBox="0 0 900 415" role="img" aria-labelledby="title desc"><title id="title">图9-1 共同目标到交付验收的对齐链</title><desc id="desc">沿“读者与任务—交付物—验收证据”顺序阅读，每个箭头都应能说明前一步怎样支持后一步；旁侧的“边界与未知”提醒团队把尚未确认的要求留作待决项。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="415" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><rect x="25" y="40" width="260" height="115" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="155.0" y="74" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">读者与任务</text><text x="155.0" y="106" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">谁要做什么</text><text x="155.0" y="134" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">当前困难是什么</text><rect x="320" y="40" width="260" height="115" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="74" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">交付物</text><text x="450.0" y="106" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">可使用的内容与系统</text><text x="450.0" y="134" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">范围与状态清楚</text><rect x="615" y="40" width="260" height="115" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="745.0" y="74" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">验收证据</text><text x="745.0" y="106" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">读者能否完成任务</text><text x="745.0" y="134" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">来源与行为能否复查</text><line x1="290" y1="98" x2="315" y2="98" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="585" y1="98" x2="610" y2="98" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="170" y="225" width="560" height="105" rx="8" fill="#F0F2F4" stroke="#555B61" stroke-width="2" stroke-dasharray="7 6"/><text x="450" y="265" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#202326">边界与未知</text><text x="450" y="303" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">未确认要求保留为待决项，不伪装成共同决定</text><line x1="155" y1="160" x2="450" y2="219" stroke="#555B61" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/><line x1="450" y1="160" x2="450" y2="219" stroke="#555B61" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/><line x1="745" y1="160" x2="450" y2="219" stroke="#555B61" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/><text x="450" y="380" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">每条箭头都要说明前一步如何支持后一步。</text></g></svg>