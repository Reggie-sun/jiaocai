<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="425px" viewBox="0 0 900 425" role="img" aria-labelledby="title desc"><title id="title">图9-3 从分歧到可核对反馈的沟通循环</title><desc id="desc">顺着“描述情境—给出证据—提出问题—复述确认—决定回应—检查后续”的箭头阅读；若证据不足，循环应回到补证据，而非直接进入归责。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="425" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><rect x="40" y="35" width="210" height="100" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="145.0" y="69" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">描述情境</text><text x="145.0" y="101" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">限定当前对象</text><rect x="345" y="35" width="210" height="100" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="69" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">给出证据</text><text x="450.0" y="101" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">可复查的观察</text><rect x="650" y="35" width="210" height="100" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="755.0" y="69" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">提出问题</text><text x="755.0" y="101" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">请求核实或改进</text><rect x="650" y="240" width="210" height="100" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="755.0" y="274" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">复述确认</text><text x="755.0" y="306" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">分清理解与认同</text><rect x="345" y="240" width="210" height="100" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="274" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">决定回应</text><text x="450.0" y="306" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">责任、动作与期限</text><rect x="40" y="240" width="210" height="100" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="145.0" y="274" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">检查后续</text><text x="145.0" y="306" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">复查实际变化</text><line x1="255" y1="85" x2="340" y2="85" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="560" y1="85" x2="645" y2="85" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="755" y1="140" x2="755" y2="235" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="645" y1="290" x2="560" y2="290" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="340" y1="290" x2="255" y2="290" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="145" y1="235" x2="145" y2="140" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="450" y="184" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#202326">证据不足时，先补查</text><text x="450" y="389" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">反馈指向任务与条件；未经证实的归因不能替代观察。</text></g></svg>