<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="330px" viewBox="0 0 900 330" role="img" aria-labelledby="title desc"><title id="title">图7-3 从挫折到下一步学习行动的反馈环路</title><desc id="desc">沿“事件—反应—事实与解释—行动—新证据”阅读环路，并观察“情绪”和“资源条件”如何影响各环节。若行动未改善结果，可以返回检查问题或寻求支持；不必把“坚持原计划”视作唯一的积极选择。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="330" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><rect x="30" y="15" width="840" height="58" rx="8" fill="#F0F2F4" stroke="#555B61" stroke-width="2"/><text x="450" y="51" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#202326">情绪与资源条件参与判断；坚持原计划只是一个选项</text><rect x="35.0" y="120" width="150" height="110" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="110.0" y="154" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">事件</text><text x="110.0" y="186" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">反馈与挑战</text><line x1="188.0" y1="175" x2="201.0" y2="175" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="110.0" y1="78" x2="110.0" y2="113" stroke="#555B61" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="205.0" y="120" width="150" height="110" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="280.0" y="154" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">反应</text><text x="280.0" y="186" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">识别情绪</text><line x1="358.0" y1="175" x2="371.0" y2="175" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="280.0" y1="78" x2="280.0" y2="113" stroke="#555B61" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="375.0" y="120" width="150" height="110" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="154" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">事实与解释</text><text x="450.0" y="186" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">分开记录</text><line x1="528.0" y1="175" x2="541.0" y2="175" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="450.0" y1="78" x2="450.0" y2="113" stroke="#555B61" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="545.0" y="120" width="150" height="110" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="620.0" y="154" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">行动</text><text x="620.0" y="186" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">调整或求助</text><line x1="698.0" y1="175" x2="711.0" y2="175" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="620.0" y1="78" x2="620.0" y2="113" stroke="#555B61" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="715.0" y="120" width="15