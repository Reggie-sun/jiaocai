<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="485px" viewBox="0 0 900 485" role="img" aria-labelledby="title desc"><title id="title">图7-5 乔布斯公开叙述中的离开、再起与回归</title><desc id="desc">时间线上标出演讲稿提到的主要事件，再看“事实记录”和“当事人回望”两种信息。创办NeXT、参与创办Pixar、苹果收购NeXT及其本人回归属于讲稿叙述；“这次挫折带来了创造性时期”是他事后的解释，不是任何人离开公司后都会得到相同结果的预测。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="485" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="450" y="32" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#202326">2005年公开讲稿对过往经历的回顾</text><line x1="105" y1="140" x2="795" y2="140" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="110" y="99" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#202326">三十岁时</text><rect x="104" y="134" width="12" height="12" rx="6" fill="#1F4E79" stroke="#1F4E79" stroke-width="2"/><text x="110" y="192" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">离开苹果</text><text x="335" y="99" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#202326">其后</text><rect x="329" y="134" width="12" height="12" rx="6" fill="#1F4E79" stroke="#1F4E79" stroke-width="2"/><text x="335" y="192" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">创办NeXT</text><text x="335" y="222" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">参与创办Pixar</text><text x="560" y="99" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#202326">多年后</text><rect x="554" y="134" width="12" height="12" rx="6" fill="#1F4E79" stroke="#1F4E79" stroke-width="2"/><text x="560" y="192" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">苹果收购NeXT</text><text x="560" y="222" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">回到苹果</text><text x="785" y="99" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#202326">2005年</text><rect x="779" y="134" width="12" height="12" rx="6" fill="#1F4E79" stroke="#1F4E79" stroke-width="2"/><text x="785" y="192" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">公开回顾经历</text><rect x="25" y="280" width="410" height="125" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="230.0" y="314" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">叙述的经历</text><text x="230.0" y="346" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">说明他怎样讲述事件</text><text x="230.0" y="374" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">仍有其他历史材料可核对</text><rect x="465" y="280" width="410" height="125" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2" stroke-dasharray="7 6"/><text x="670.0" y="314" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">当事人的回望解释</text><text x="670.0" y="346" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">他赋予经历的意义</text><text x="670.0" y="374" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">不构成他人结果的预测</text><text x="450" y="453" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">公开叙述的顺序不证明挫折必然导致成功。</text></g></svg>