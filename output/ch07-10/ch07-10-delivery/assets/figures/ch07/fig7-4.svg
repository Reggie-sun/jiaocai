<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="545px" viewBox="0 0 900 545" role="img" aria-labelledby="title desc"><title id="title">图7-4 从同伴经验提取可迁移方法</title><desc id="desc">从他人展示的结果向回追问先备、行动、反馈和资源，再用“能直接借用、需修改、暂不适用”区分迁移条件。图意不是让学生复制另一人的路线，而是把可观察的学习过程带回自己的任务检验。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="545" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><rect x="300" y="20" width="300" height="90" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="54" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">同伴展示的结果</text><text x="450.0" y="86" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">先追问过程与条件</text><line x1="450" y1="115" x2="160" y2="157" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="20" y="165" width="280" height="115" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="160.0" y="199" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">先备与资源</text><text x="160.0" y="231" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">已有知识</text><text x="160.0" y="259" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">时间与支持</text><line x1="450" y1="115" x2="450" y2="157" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="310" y="165" width="280" height="115" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="199" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">行动与反馈</text><text x="450.0" y="231" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">做了什么</text><text x="450.0" y="259" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">怎样检查</text><line x1="450" y1="115" x2="740" y2="157" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="600" y="165" width="280" height="115" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="740.0" y="199" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">我的当前任务</text><text x="740.0" y="231" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">相似条件</text><text x="740.0" y="259" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">关键差异</text><path d="M160 287 V322 H740 V287" fill="none" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="450" y1="287" x2="450" y2="355" stroke="#1F4E79" stroke-width="2" stroke-linecap="round"/><rect x="20" y="380" width="280" height="90" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="160.0" y="414" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">直接借用</text><text x="160.0" y="446" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">关键条件一致</text><rect x="310" y="380" width="280" height="90" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="414" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">修改后试用</text><text x="450.0" y="446" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">有差异可调整</text><rect x="600" y="380" width="280" height="90" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2" stroke-dasharray="7 6"/><text x="740.0" y="414" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">暂不适用</text><text x="740.0" y="446" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">必要条件缺失</text><path d="M450 355 H160 V375" fill="none" stroke="#555B61" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><line x1="450" y1="355" x2="450" y2="375" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M450 355 H740 V375" fill="none" stroke="#555B61" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="450" y="515" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">迁移的是可检查的方法，不能复制他人的成功保证。</text></g></svg>