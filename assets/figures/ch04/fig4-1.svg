<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="620px" viewBox="0 0 900 620" role="img" aria-labelledby="title desc"><title id="title">批判性思维的六项技能如何协同</title><desc id="desc">把六项技能放在可往返的判断过程里：解释任务与语境→分析主张和理由→评估证据及规则→推理出暂定结论→解释理由→自我检查并修正；质疑作为入口动作贯穿全程。用回环箭头提示过程可迭代，而非线性考试清单。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="620" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><line x1="524.694662326192" y1="135.72367430940133" x2="614.5585613142775" y2="166.67139664660868" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="696.817240078565" y1="274.0" x2="696.817240078565" y2="278.0" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="622.122577752373" y1="390.7236743094013" x2="532.2586787642874" y2="421.6713966466087" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="375.305337673808" y1="424.2763256905987" x2="285.44143868572246" y2="393.3286033533914" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="203.18275992143504" y1="286.00000000000006" x2="203.18275992143504" y2="282.0" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="277.877422247627" y1="169.2763256905987" x2="367.7413212357126" y2="138.32860335339132" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="450.0" cy="110.0" r="76" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="100.0" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">解读</text><text x="450.0" y="130.0" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">任务与语境</text><circle cx="696.817240078565" cy="195.0" r="76" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="696.817240078565" y="185.0" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">分析</text><text x="696.817240078565" y="215.0" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">主张与理由</text><circle cx="696.817240078565" cy="365.0" r="76" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="696.817240078565" y="355.0" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">评估</text><text x="696.817240078565" y="385.0" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">证据与规则</text><circle cx="450.0" cy="450.0" r="76" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="440.0" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">推理</text><text x="450.0" y="470.0" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">暂定结论</text><circle cx="203.18275992143504" cy="365.00000000000006" r="76" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="203.18275992143504" y="355.00000000000006" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">解释</text><text x="203.18275992143504" y="385.00000000000006" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">说明依据</text><circle cx="203.182759921435" cy="195.0" r="76" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="203.182759921435" y="185.0" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">自我调节</text><text x="203.182759921435" y="215.0" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">检查并修正</text><text x="450" y="273" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#202326">依据证据往返</text><text x="450" y="306" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">并记录修正理由</text><text x="450" y="582" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">环路是教学组织，不表示每次都按固定顺序执行</text></g></svg>