<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="510px" viewBox="0 0 900 510" role="img" aria-labelledby="title desc"><title id="title">从传播热度回到主张证据</title><desc id="desc">把社交媒体消息中的原始主张、转发数、独立来源、原始材料、推论和结论边界分层连接；用问号标出缺失环节，强调热度说明传播而非真实性。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="510" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><rect x="40" y="50" width="330" height="85" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="205.0" y="83" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">转发数与评论</text><text x="205.0" y="113" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">只说明传播情况</text><rect x="530" y="50" width="330" height="85" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="695.0" y="83" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">原始材料与来源</text><text x="695.0" y="113" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">检查对应主张</text><text x="450" y="100" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="40px" font-weight="bold" fill="#202326">≠</text><line x1="695" y1="145" x2="695" y2="207" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="515" y="217" width="360" height="85" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="695.0" y="250" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">来源是否彼此独立？</text><text x="695.0" y="280" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">同一稿件转载≠多份证据</text><line x1="695" y1="312" x2="695" y2="365" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="40" y="377" width="820" height="100" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="410" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">结论范围：材料支持什么，又没有支持什么？</text><text x="450.0" y="440" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">将传播热度与事实支持分别记录</text></g></svg>