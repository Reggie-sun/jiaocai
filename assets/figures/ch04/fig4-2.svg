<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="495px" viewBox="0 0 900 495" role="img" aria-labelledby="title desc"><title id="title">先前准备程度如何混杂AI使用与通过结果</title><desc id="desc">有向无环图：先前准备程度→是否使用AI；先前准备程度→通过结果；是否使用AI→通过结果以虚线呈现为待检验关系。突出观察到的使用与通过相关，不自动识别后一个箭头。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="495" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><rect x="305" y="35" width="290" height="85" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="68" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">先前准备程度</text><text x="450.0" y="98" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">可能的共同原因</text><rect x="60" y="300" width="290" height="85" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="205.0" y="333" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">是否使用AI</text><text x="205.0" y="363" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">观察到的选择</text><rect x="550" y="300" width="290" height="85" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="695.0" y="333" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">通过结果</text><text x="695.0" y="363" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">观察到的结果</text><line x1="340" y1="130" x2="230" y2="286" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="565" y1="130" x2="665" y2="286" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="363" y1="343" x2="537" y2="343" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="450" y="318" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">待检验</text><text x="450" y="457" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">共同原因可能产生相关；虚线不是已证实的因果效应</text></g></svg>