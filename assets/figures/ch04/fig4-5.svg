<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="535px" viewBox="0 0 900 535" role="img" aria-labelledby="title desc"><title id="title">一份可检查的论证由哪些部分组成</title><desc id="desc">展示主张、证据、推理连接、隐含假设、限定语、反例和回应之间的有向关系；用校园咨询服务案例中的原句作短标签，图区分‘相关材料’与‘实际支撑主张的证据’。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="535" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><rect x="40" y="40" width="330" height="85" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="205.0" y="73" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">证据：有限试点记录</text><text x="205.0" y="103" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">对象、时间和口径清楚</text><rect x="530" y="40" width="330" height="85" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="695.0" y="73" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">假设：能迁移到新对象</text><text x="695.0" y="103" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">需要额外核验</text><rect x="250" y="235" width="400" height="100" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="268" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">推理连接</text><text x="450.0" y="298" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">证据怎样支持这一主张？</text><line x1="215" y1="135" x2="360" y2="218" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="695" y1="135" x2="540" y2="218" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#arrow)"/><line x1="450" y1="345" x2="450" y2="392" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="40" y="402" width="820" height="100" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="435" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">有限结论：在已测条件下，可继续有限验证</text><text x="450.0" y="465" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">反例、反对理由与回应需在旁边公开</text></g></svg>