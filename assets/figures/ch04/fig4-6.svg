<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="480px" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">用计算思维检查并迭代一个判断</title><desc id="desc">将复杂议题分解为目标/对象、证据、假设、指标、受影响群体、替代方案、检查规则；箭头展示可执行的证据核查与敏感性分析，结果不稳时返回修订问题表示和结论边界。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="480" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="450" y="40" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#202326">从复杂争论到可以检查的问题</text><rect x="35" y="115" width="185" height="140" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="127.5" y="148" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">分解</text><text x="127.5" y="178" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">目标与对象</text><text x="127.5" y="208" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">证据及缺口</text><line x1="225" y1="183" x2="249" y2="183" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="255" y="115" width="185" height="140" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="347.5" y="148" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">模式识别</text><text x="347.5" y="178" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">共同结构</text><text x="347.5" y="208" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">保留例外</text><line x1="445" y1="183" x2="469" y2="183" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="475" y="115" width="185" height="140" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="567.5" y="148" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">检查规则</text><text x="567.5" y="178" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">分母与约束</text><text x="567.5" y="208" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">检验假设</text><line x1="665" y1="183" x2="689" y2="183" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="695" y="115" width="185" height="140" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="787.5" y="148" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">比较与反馈</text><text x="787.5" y="178" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">敏感性分析</text><text x="787.5" y="208" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">结论边界</text><path d="M795 280 V350 H135 V280" fill="none" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="450" y="395" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">证据不足或排序不稳：返回补材料、改表示或缩小结论</text><text x="450" y="444" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">可执行检查帮助论证；价值取舍仍需说明理由</text></g></svg>