<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="550px" viewBox="0 0 900 550" role="img" aria-labelledby="title desc"><title id="title">同一准确率背后的两类错误</title><desc id="desc">混淆矩阵：需要专员96条提示正确、24条漏报；普通问题132条误报、748条正确放行。附分母说明而非只显示百分数；标记数据为教学模拟。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="550" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="520" y="40" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#202326">教学模拟：1000条记录</text><text x="370" y="94" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">系统提示专员</text><text x="670" y="94" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">系统未提示</text><text x="105" y="180" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">实际需要</text><text x="105" y="210" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">专员</text><rect x="220" y="122" width="290" height="125" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="365.0" y="155" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">正确提示</text><text x="365.0" y="185" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">96</text><rect x="520" y="122" width="300" height="125" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="670.0" y="155" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">漏报</text><text x="670.0" y="185" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">24</text><text x="105" y="318" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">实际普通</text><text x="105" y="348" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">问题</text><rect x="220" y="260" width="290" height="125" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="365.0" y="293" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">误报</text><text x="365.0" y="323" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">132</text><rect x="520" y="260" width="300" height="125" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="670.0" y="293" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">正确放行</text><text x="670.0" y="323" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">748</text><text x="450" y="438" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">提示精确率＝96÷(96＋132)≈42.1%</text><text x="450" y="477" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">召回率＝96÷(96＋24)＝80.0%</text><text x="450" y="516" text-anchor="middle" font-family="Noto Sans CJK SC