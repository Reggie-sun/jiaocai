<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="705px" viewBox="0 0 900 705" role="img" aria-labelledby="title desc"><title id="title">联邦学习的数据与更新流向</title><desc id="desc">三个机构各自保留原始记录并进行本地训练；模型更新流向协调方聚合，汇总模型再返回机构。图说明数据流转方式，不代表更新天然安全或隐私风险已经消除。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3.5 L0,7 z" fill="#1F4E79"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,10 L10,0 M8,12 L12,8" stroke="#676767" stroke-width="1.5"/></pattern></defs><rect width="900" height="705" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="450" y="43" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#222222" fill-opacity="1.0">多方在本地训练；协调方只接收模型更新并汇总</text><rect x="43" y="76" width="244" height="232" rx="10" fill="#EEF1F4" stroke="#676767" stroke-width="2.5" stroke-dasharray="9 7"/><text x="165" y="108" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#222222" fill-opacity="1.0">机构A</text><rect x="109" y="114" width="112" height="32" rx="4" fill="#FFFFFF" stroke="#222222" stroke-width="2"/><rect x="116" y="124" width="112" height="32" rx="4" fill="#FFFFFF" stroke="#222222" stroke-width="2"/><rect x="123" y="134" width="112" height="32" rx="4" fill="#FFFFFF" stroke="#222222" stroke-width="2"/><text x="165" y="194" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#222222" fill-opacity="1.0">本地原始记录</text><line x1="165" y1="204" x2="165" y2="222" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="80" y="224" width="170" height="54" rx="10" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2.5"/><text x="165" y="259" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#1F4E7