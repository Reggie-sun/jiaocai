<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="590px" viewBox="0 0 900 590" role="img" aria-labelledby="title desc"><title id="title">依赖关系与最早任务时间线</title><desc id="desc">T1确认文本耗时1小时，T2预约空间耗时2小时；T3依赖T1、耗时2小时；T4依赖T2和T3、耗时1小时。时间线使用统一的0至4小时刻度，逻辑上并行不保证现实资源一定允许并行。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3.5 L0,7 z" fill="#1F4E79"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,10 L10,0 M8,12 L12,8" stroke="#676767" stroke-width="1.5"/></pattern></defs><rect width="900" height="590" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="450" y="43" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#222222" fill-opacity="1.0">任务箭头表示先后依赖；下方使用同一小时刻度</text><line x1="254" y1="130" x2="369" y2="130" stroke="#1F4E79" stroke-width="3" marker-end="url(#arrow)"/><line x1="254" y1="236" x2="646" y2="183" stroke="#1F4E79" stroke-width="3" marker-end="url(#arrow)"/><line x1="527" y1="130" x2="646" y2="183" stroke="#1F4E79" stroke-width="3" marker-end="url(#arrow)"/><rect x="95" y="91" width="160" height="78" rx="10" fill="#EEF1F4" stroke="#1F4E79" stroke-width="2.5"/><text x="175" y="126" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#222222" fill-opacity="1.0">T1  确认文本</text><text x="175" y="157" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#222222" fill-opacity="1.0">1小时</text><rect x="95" y="197" width="160" height="78" rx="10" fill="#EEF1F4" stroke="#1F4E79" stroke-width="2.5"/><text x="175" y="232" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#222222" fill-opacity="1.0">T2  预约空间</text><text x="175" y="263" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#222222" fill-opacity="1.0">2小时</text><rect x="368" y="91" width="160" height="78" rx="10" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/><text x="448" y="126" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#222222" fill-opacity="1.0">T3  制作打印稿</text><text x="448" y="157" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#222222" fill-opacity="1.0">2小时</text><rect x="645" y="144" width="160" height="78" rx="10" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/><text x="725" y="179" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#222222" fill-opacity="1.0">T4  安装检查</text><text x="725" y="210" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#222222" fill-opacity="1.0">1小时</text><text x="450" y="300" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#222222" fill-opacity="1.0">只看逻辑依赖时，T1与T2可以同时开始；现实仍要检查人手和场地。</text><line x1="178.0" y1="340" x2="178.0" y2="520" stroke="#A0A0A0" stroke-width="1.8"/><text x="178.0" y="331" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#222222" fill-opacity="1.0">0h</text><line x1="341.5" y1="340" x2="341.5" y2="520" stroke="#A0A0A0" stroke-width="1.8"/><text x="341.5" y="331" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#222222" fill-opacity="1.0">1h</text><line x1="505.0" y1="340" x2="505.0" y2="520" stroke="#A0A0A0" stroke-width="1.8"/><text x="505.0" y="331" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#222222" fill-opacity="1.0">2h</text><line x1="668.5" y1="340" x2="668.5" y2="520" stroke="#A0A0A0" stroke-width="1.8"/><text x="668.5" y="331" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#222222" fill-opacity="1.0">3h</text><line x1="832.0" y1="340" x2="832.0" y2="520" stroke="#A0A0A0" stroke-width="1.8"/><text x="832.0" y="331" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#222222" fill-opacity="1.0">4h</text><text x="43" y="385" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#222222" fill-opacity="1.0">T1</text><text x="43" y="426" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#222222" fill-opacity="1.0">T2</text><text x="43" y="467" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#222222" fill-opacity="1.0">T3</text><text x="43" y="508" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#222222" fill-opacity="1.0">T4</text><rect x="178.0" y="360" width="163.5" height="30" rx="3" fill="#1F4E79" stroke="#1F4E79" stroke-width="2.5"/><text x="259.75" y="382" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#FFFFFF" fill-opacity="1.0">1h</text><rect x="178.0" y="401" width="327.0" height="30" rx="3" fill="#EEF1F4" stroke="#222222" stroke-width="2.5"/><text x="341.5" y="423" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#222222" fill-opacity="1.0">2h</text><rect x="341.5" y="442" width="327.0" height="30" rx="3" fill="#1F4E79" stroke="#1F4E79" stroke-width="2.5"/><text x="505.0" y="464" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#FFFFFF" fill-opacity="1.0">2h</text><rect x="668.5" y="483" width="163.5" height="30" rx="3" fill="#EEF1F4" stroke="#222222" stroke-width="2.5"/><text x="750.25" y="505" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#222222" fill-opacity="1.0">1h</text><text x="505" y="563" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#222222" fill-opacity="1.0">最早在第4小时完成；不是把四项时长相加成6小时。</text></g></svg>