<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="480px" viewBox="0 0 900 480" role="img" aria-labelledby="title desc"><title id="title">卷积网络从局部输入形成任务表示的概念示意</title><desc id="desc">图示以台阶形局部图像为例，从像素局部、可能的边缘响应、组合响应到任务输出。它不是任何真实模型的激活图，也不声称网络层与人类概念一一对应。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3.5 L0,7 z" fill="#1F4E79"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,10 L10,0 M8,12 L12,8" stroke="#676767" stroke-width="1.5"/></pattern></defs><rect width="900" height="480" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><rect x="56" y="135" width="29" height="29" fill="#EEF1F4" stroke="#676767" stroke-width="1.5"/><rect x="90" y="135" width="29" height="29" fill="#EEF1F4" stroke="#676767" stroke-width="1.5"/><rect x="124" y="135" width="29" height="29" fill="#EEF1F4" stroke="#676767" stroke-width="1.5"/><rect x="158" y="135" width="29" height="29" fill="#EEF1F4" stroke="#676767" stroke-width="1.5"/><rect x="192" y="135" width="29" height="29" fill="#EEF1F4" stroke="#676767" stroke-width="1.5"/><rect x="56" y="169" width="29" height="29" fill="#EEF1F4" stroke="#676767" stroke-width="1.5"/><rect x="90" y="169" width="29" height="29" fill="#B7C1CA" stroke="#676767" stroke-width="1.5"/><rect x="124" y="169" width="29" height="29" fill="#B7C1CA" stroke="#676767" stroke-width="1.5"/><rect x="158" y="169" width="29" height="29" fill="#B7C1CA" stroke="#676767" stroke-width="1.5"/><rect x="192" y="169" width="29" height="29" fill="#EEF1F4" stroke="#676767" stroke-width="1.5"/><rect x="56" y="203" width="29" height="29" fill="#EEF1F4" stroke="#676767" stroke-width="1.5"/><rect x="90" y="203" width="29" height="29" fill="#EEF1F4" stroke="#676767" stroke-width="1.5"/><rect x="124" y="203" width="29" height="29" fill="#EEF1F4" stroke="#676767" stroke-width="1.5"/><rect x="158" y="203" width="29" height="29" fill="#B7C1CA" stroke="#676767" stroke-width="1.5"/><rect x="192" y="203" width="29" height="29" fill="#EEF1F4" stroke="#676767" stroke-width="1.5"/><rect x="56" y="237" width="29" height="29" fill="#EEF1F4" stroke="#676767" stroke-width="1.5"/><rect x="90" y="237" width="29" height="29" fill="#EEF1F4" stroke="#676767" stroke-width="1.5"/><rect x="124" y="237" width="29" height="29" fill="#B7C1CA" stroke="#676767" stroke-width="1.5"/><rect x="158" y="237" width="29" height="29" fill="#B7C1CA" stroke="#676767" stroke-width="1.5"/><rect x="192" y="237" width="29" height="29" fill="#EEF1F4" stroke="#676767" stroke-width="1.5"/><rect x="56" y="271" width="29" height="29" fill="#EEF1F4" stroke="#676767" stroke-width="1.5"/><rect x="90" y="271" width="29" height="29" fill="#B7C1CA" stroke="#676767" stroke-width="1.5"/><rect x="124" y="271" width="29" height="29" fill="#B7C1CA" stroke="#676767" stroke-width="1.5"/><rect x="158" y="271" width="29" height="29" fill="#B7C1CA" stroke="#676767" stroke-width="1.5"/><rect x="192" y="271" width="29" height="29" fill="#EEF1F4" stroke="#676767" stroke-width="1.5"/><text x="145" y="105" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#222222" fill-opacity="1.0">输入局部</text><text x="145" y="343" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#222222" fill-opacity="1.0">像素亮暗</text><text x="145" y="374" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#222222" fill-opacity="1.0">按位置排列</text><line x1="264" y1="214" x2="305" y2="214" stroke="#1F4E79" stroke-width="3" marker-end="url(#arrow)"/><rect x="312" y="126" width="160" height="184" rx="10" fill="#FFFFFF" stroke="#676767" stroke-width="2.5"/><line x1="338" y1="163" x2="385" y2="163" stroke="#1F4E79" stroke-width="3"/><line x1="394" y1="163" x2="440" y2="163" stroke="#222222" stroke-width="3"/><line x1="338" y1="207" x2="338" y2="248" stroke="#1F4E79" stroke-width="3"/><line x1="382" y1="207" x2="426" y2="207" stroke="#222222" stroke-width="3"/><line x1="426" y1="207" x2="426" y2="250" stroke="#1F4E79" stroke-width="3"/><line x1="360" y1="251" x2="405" y2="251" stroke="#222222" stroke-width="3"/><text x="392" y="105" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#222222" fill-opacity="1.0">局部响应</text><text x="392" y="343" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#222222" fill-opacity="1.0">可能对边缘、</text><text x="392" y="374" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#222222" fill-opacity="1.0">方向敏感</text><line x1="473" y1="214" x2="516" y2="214" stroke="#1F4E79" stroke-width="3" marker-end="url(#arrow)"/><rect x="524" y="126" width="160" height="184" rx="10" fill="#EEF1F4" stroke="#1F4E79" stroke-width="2.5"/><path d="M550 258 L550 220 L580 220 L580 183 L610 183 L610 153 L650 153" fill="none" stroke="#1F4E79" stroke-width="6"/><path d="M550 268 L650 268" fill="none" stroke="#676767" stroke-width="2.5" stroke-dasharray="10 7"/><text x="604" y="105" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#222222" fill-opacity="1.0">组合响应</text><text x="604" y="343" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#222222" fill-opacity="1.0">可形成纹理或</text><text x="604" y="374" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#222222" fill-opacity="1.0">局部形状模式</text><line x1="686" y1="214" x2="726" y2="214" stroke="#1F4E79" stroke-width="3" marker-end="url(#arrow)"/><rect x="735" y="126" width="145" height="184" rx="10" fill="#FFFFFF" stroke="#676767" stroke-width="2.5"/><text x="807" y="105" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#222222" fill-opacity="1.0">任务输出</text><rect x="752" y="158" width="111" height="48" rx="10" fill="#EEF1F4" stroke="#676767" stroke-width="2.5"/><text x="807" y="190" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#222222" fill-opacity="1.0">候选类别</text><rect x="752" y="221" width="111" height="48" rx="10" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2.5" stroke-dasharray="9 7"/><text x="807" y="253" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#222222" fill-opacity="1.0">任务分数</text><text x="807" y="343" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#222222" fill-opacity="1.0">随任务目标</text><text x="807" y="374" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#222222" fill-opacity="1.0">计算结果</text><rect x="48" y="392" width="804" height="66" rx="10" fill="#EEF1F4" stroke="#676767" stroke-width="2.5"/><text x="450" y="419" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#222222" fill-opacity="1.0">分层图只是帮助理解的可能路径；真实响应不保证对应固定、可命名的现实概念。</text><text x="450" y="446" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#222222" fill-opacity="1.0">模型学到什么取决于数据、标签、网络结构和训练目标。</text></g></svg>