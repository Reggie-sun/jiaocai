<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="445px" viewBox="0 0 900 445" role="img" aria-labelledby="title desc"><title id="title">通知中可记录事实与尚缺证据</title><desc id="desc">左侧为模拟通知。中间列只保留通知明确给出的事实；右侧列出整段无台阶通行承诺仍缺少的入口到电梯、以及电梯到房间连接信息。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3.5 L0,7 z" fill="#1F4E79"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,10 L10,0 M8,12 L12,8" stroke="#676767" stroke-width="1.5"/></pattern></defs><rect width="900" height="445" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><rect x="24" y="54" width="270" height="316" rx="10" fill="#EEF1F4" stroke="#676767" stroke-width="2.5"/><text x="159" y="91" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#222222" fill-opacity="1.0">模拟通知原文</text><text x="48" y="139" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#222222" fill-opacity="1.0">周五下午，设计楼301</text><text x="48" y="178" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#222222" fill-opacity="1.0">举行海报工作坊。</text><text x="48" y="217" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#222222" fill-opacity="1.0">13:50签到，14:00开场，</text><text x="48" y="256" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#222222" fill-opacity="1.0">15:30结束。</text><text x="48" y="295" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#222222" fill-opacity="1.0">西侧电梯可到三层。</text><line x1="294" y1="210" x2="329" y2="210" stroke="#1F4E79" stroke-width="3" marker-end="url(#arrow)"/><rect x="330" y="54" width="274" height="316" rx="10" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2.5"/><text x="467" y="91" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79" fill-opacity="1.0">可直接记录</text><circle cx="367" cy="140" r="16" fill="#FFFFFF" stroke="#1F4E79" stroke-width="3"/><text x="367" y="148" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#222222" fill-opacity="1.0">✓</text><text x="397" y="148" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#222222" fill-opacity="1.0">日期：周五</text><circle cx="367" cy="194" r="16" fill="#FFFFFF" stroke="#1F4E79" stroke-width="3"/><text x="367" y="202" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#222222" fill-opacity="1.0">✓</text><text x="397" y="202" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#222222" fill-opacity="1.0">签到：13:50</text><circle cx="367" cy="248" r="16" fill="#FFFFFF" stroke="#1F4E79" stroke-width="3"/><text x="367" y="256" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#222222" fill-opacity="1.0">✓</text><text x="397" y="256" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#222222" fill-opacity="1.0">地点：设计楼301</text><circle cx="367" cy="302" r="16" fill="#FFFFFF" stroke="#1F4E79" stroke-width="3"/><text x="367" y="310" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#222222" fill-opacity="1.0">✓</text><text x="397" y="310" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#222222" fill-opacity="1.0">电梯：到三层</text><path d="M604 207 C623 207 626 207 644 207" fill="none" stroke="#676767" stroke-width="2.5" stroke-dasharray="10 7" marker-end="url(#arrow)"/><rect x="646" y="54" width="230" height="316" rx="10" fill="#FFFFFF" stroke="#676767" stroke-width="2.5" stroke-dasharray="9 7"/><text x="761" y="91" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#222222" fill-opacity="1.0">仍需核验</text><rect x="670" y="119" width="182" height="64" rx="10" fill="#EEF1F4" stroke="#676767" stroke-width="2.5"/><text x="761" y="145" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#222222" fill-opacity="1.0">“整段无台阶</text><text x="761" y="172" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#222222" fill-opacity="1.0">可到达”</text><text x="761" y="221" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#1F4E79" fill-opacity="1.0">通知未说明</text><text x="674" y="259" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#222222" fill-opacity="1.0">入口→电梯</text><text x="674" y="290" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#222222" fill-opacity="1.0">电梯→房间</text><text x="674" y="321" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#222222" fill-opacity="1.0">有电梯 ≠</text><text x="674" y="352" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#222222" fill-opacity="1.0">整段路线可达</text><text x="450" y="414" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#222222" fill-opacity="1.0">把“未提供”保留下来，不能把空白补成肯定事实。</text></g></svg>