<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="710px" viewBox="0 0 900 710" role="img" aria-labelledby="title desc"><title id="title">自注意力中查询、键和值的概念关系</title><desc id="desc">当前位置形成查询Q，与可用位置各自的键K匹配后形成权重；对应的值V按权重汇总成当前位置的新表示。图中没有真实权重数值，预测任务必须按任务设置限制可访问的时间位置。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,3.5 L0,7 z" fill="#1F4E79"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M-2,2 L2,-2 M0,10 L10,0 M8,12 L12,8" stroke="#676767" stroke-width="1.5"/></pattern></defs><rect width="900" height="710" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="450" y="40" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#222222" fill-opacity="1.0">以当前记录为例：先形成Q，再与可用位置的K逐一匹配</text><rect x="88" y="69" width="184" height="53" rx="10" fill="#EEF1F4" stroke="#676767" stroke-width="2.5"/><text x="180" y="103" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#222222" fill-opacity="1.0">此前位置1</text><rect x="358" y="69" width="184" height="53" rx="10" fill="#EEF1F4" stroke="#676767" stroke-width="2.5"/><text x="450" y="103" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#222222" fill-opacity="1.0">此前位置2</text><rect x="628" y="69" width="184" height="53" rx="10" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2.5" stroke-dasharray="9 7"/><text x="720" y="103" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#222222" fill-opacity="1.0">当前位置</text><rect x="642" y="145" width="156" height="52" rx="10" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2.5"/><text x="720" y="179" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79" fill-opacity="1.0">查询 Q</text><line x1="720" y1="197" x2="180" y2="223" stroke="#1F4E79" stroke-width="2.7" marker-end="url(#arrow)"/><line x1="720" y1="197" x2="450" y2="223" stroke="#1F4E79" stroke-width="2.7" marker-end="url(#arrow)"/><line x1="720" y1="197" x2="720" y2="223" stroke="#1F4E79" stroke-width="2.7" marker-end="url(#arrow)"/><rect x="103" y="222" width="154" height="52" rx="10" fill="#EEF1F4" stroke="#676767" stroke-width="2.5"/><text x="180" y="256" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#222222" fill-opacity="1.0">键 K1</text><line x1="180" y1="274" x2="180" y2="300" stroke="#1F4E79" stroke-width="2.7" marker-end="url(#arrow)"/><rect x="115" y="301" width="130" height="49" rx="10" fill="#FFFFFF" stroke="#676767" stroke-width="2.5"/><text x="180" y="333" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#222222" fill-opacity="1.0">权重 α1</text><rect x="373" y="222" width="154" height="52" rx="10" fill="#EEF1F4" stroke="#676767" stroke-width="2.5"/><text x="450" y="256" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#222222" fill-opacity="1.0">键 K2</text><line x1="450" y1="274" x2="450" y2="300" stroke="#1F4E79" stroke-width="2.7" marker-end="url(#arrow)"/><rect x="385" y="301" width="130" height="49" rx="10" fill="#FFFFFF" stroke="#676767" stroke-width="2.5"/><text x="450" y="333" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#222222" fill-opacity="1.0">权重 α2</text><rect x="643" y="222" width="154" height="52" rx="10" fill="#EEF1F4" stroke="#676767" stroke-width="2.5"/><text x="720" y="256" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#222222" fill-opacity="1.0">键 K3</text><line x1="720" y1="274" x2="720" y2="300" stroke="#1F4E79" stroke-width="2.7" marker-end="url(#arrow)"/><rect x="655" y="301" width="130" height="49" rx="10" fill="#FFFFFF" stroke="#676767" stroke-width="2.5"/><text x="720" y="333" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#222222" fill-opacity="1.0">权重 α3</text><text x="450" y="383" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#222222" fill-opacity="1.0">Q与每个K的匹配共同决定权重</text><rect x="113" y="400" width="134" height="50" rx="10" fill="#EEF1F4" stroke="#676767" stroke-width="2.5"/><text x="180" y="433" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#222222" fill-opacity="1.0">值 V1</text><rect x="383" y="400" width="134" height="50" rx="10" fill="#EEF1F4" stroke="#676767" stroke-width="2.5"/><text x="450" y="433" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#222222" fill-opacity="1.0">值 V2</text><rect x="653" y="400" width="134" height="50" rx="10" fill="#EEF1F4" stroke="#676767" stroke-width="2.5"/><text x="720" y="433" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#222222" fill-opacity="1.0">值 V3</text><path d="M180 453 C180 480 280 481 355 491" fill="none" stroke="#676767" stroke-width="2.3" marker-end="url(#arrow)"/><path d="M450 453 L450 491" fill="none" stroke="#1F4E79" stroke-width="4.0" marker-end="url(#arrow)"/><path d="M720 453 C720 480 620 481 545 491" fill="none" stroke="#676767" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="345" y="485" width="210" height="54" rx="10" fill="#EEF1F4" stroke="#1F4E79" stroke-width="2.5"/><text x="450" y="520" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#1F4E79" fill-opacity="1.0">加权汇总：Σ αᵢVᵢ</text><line x1="450" y1="540" x2="450" y2="565" stroke="#1F4E79" stroke-width="2.7" marker-end="url(#arrow)"/><rect x="321" y="565" width="258" height="47" rx="10" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/><text x="450" y="596" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#222222" fill-opacity="1.0">当前位置的新表示</text><text x="450" y="647" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#222222" fill-opacity="1.0">连线粗细仅作权重示意，不含实测数值。</text><text x="450" y="676" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#222222" fill-opacity="1.0">预测时只能汇总当时允许访问的位置；权重不是因果解释。</text></g></svg>