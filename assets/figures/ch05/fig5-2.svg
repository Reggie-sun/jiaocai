<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="590px" viewBox="0 0 900 590" role="img" aria-labelledby="title desc"><title id="title">从观察到证据再到问题修订</title><desc id="desc">流程从一条模拟观察开始，经由多个解释和对应证据，到达更新后的判断或标记未知，再返回问题。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="590" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><rect x="40" y="30" width="820" height="100" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="63" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">模拟观察：页面显示空位，仍未完成预约</text><text x="450.0" y="93" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">先记录差异，不能直接决定原因</text><rect x="50" y="205" width="200" height="100" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="150.0" y="238" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">候选解释A</text><text x="150.0" y="268" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">状态更新延迟</text><line x1="450" y1="141" x2="150" y2="191" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#arrow)"/><line x1="150" y1="317" x2="450" y2="375" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="350" y="205" width="200" height="100" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="238" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">候选解释B</text><text x="450.0" y="268" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">资格或规则不清</text><line x1="450" y1="141" x2="450" y2="191" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#arrow)"/><line x1="450" y1="317" x2="450" y2="375" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="650" y="205" width="200" height="100" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="750.0" y="238" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">候选解释C</text><text x="750.0" y="268" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">入口操作有障碍</text><line x1="450" y1="141" x2="750" y2="191" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#arrow)"/><line x1="750" y1="317" x2="450" y2="375" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="145" y="390" width="610" height="100" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="423" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">证据能区分哪种解释？</text><text x="450.0" y="453" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">检查记录、任务操作与对应条件</text><path d="M775 441 H870 V75" fill="none" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="450" y="550" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">无法区分时保留“未知”，修订问题与下一步</text></g></svg>