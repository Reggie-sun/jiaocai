<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="680px" viewBox="0 0 900 680" role="img" aria-labelledby="title desc"><title id="title">跨界迁移中的结构对应与失效点</title><desc id="desc">左右两列显示来源服务与预约服务的四段关系映射；连接旁列出数据、现场、隐私和渠道差异。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="680" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="245" y="37" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#202326">源域：在线服务</text><text x="665" y="37" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#202326">目标域：维修预约</text><rect x="40" y="95" width="350" height="75" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="215.0" y="128" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">用户提出请求</text><rect x="510" y="95" width="350" height="75" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="685.0" y="128" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">顾客描述维修任务</text><line x1="400" y1="132" x2="498" y2="132" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="40" y="190" width="350" height="75" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="215.0" y="223" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">服务方检查资源</text><rect x="510" y="190" width="350" height="75" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="685.0" y="223" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">技师确认零件与时段</text><line x1="400" y1="227" x2="498" y2="227" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="40" y="285" width="350" height="75" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="215.0" y="318" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">服务状态变化</text><rect x="510" y="285" width="350" height="75" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="685.0" y="318" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">维修阶段与预约变更</text><line x1="400" y1="322" x2="498" y2="322" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="40" y="380" width="350" height="75" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="215.0" y="413" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">双方获得反馈</text><rect x="510" y="380" width="350" height="75" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="685.0" y="413" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">电话/窗口/线上同步</text><line x1="400" y1="417" x2="498" y2="417" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="40" y="550" width="820" height="100" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="583" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">失效点：账户与设备门槛、库存滞后、责任未落实</text><text x="450.0" y="613" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">保留的是任务关系；访问方式与现场条件须重新核验</text><text x="450" y="498" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">实线表示候选对应，不是迁移成功的实测证明</text></g></svg>