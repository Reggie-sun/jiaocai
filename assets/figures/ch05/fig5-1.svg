<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="615px" viewBox="0 0 900 615" role="img" aria-labelledby="title desc"><title id="title">发散、收敛与再调查的循环</title><desc id="desc">一组箭头先从问题进入多种候选，经过不能被总分抵消的硬约束检查，再比较并测试；若证据不足，箭头返回调查或发散。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="615" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><rect x="305" y="30" width="290" height="85" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="63" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">调查任务与约束</text><text x="450.0" y="93" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">先界定要解决的问题</text><line x1="450" y1="127" x2="120" y2="205" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="30" y="220" width="180" height="75" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="120.0" y="253" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">改变信息表达</text><line x1="120" y1="306" x2="450" y2="380" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="450" y1="127" x2="340" y2="205" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="250" y="220" width="180" height="75" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="340.0" y="253" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">改变服务渠道</text><line x1="340" y1="306" x2="450" y2="380" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="450" y1="127" x2="560" y2="205" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="470" y="220" width="180" height="75" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="560.0" y="253" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">改变匹配顺序</text><line x1="560" y1="306" x2="450" y2="380" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="450" y1="127" x2="780" y2="205" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="690" y="220" width="180" height="75" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="780.0" y="253" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">改变确认流程</text><line x1="780" y1="306" x2="450" y2="380" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="220" y="395" width="460" height="130" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="428" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">硬约束先筛查，再比较偏好</text><text x="450.0" y="458" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">总分不能抵消硬约束</text><text x="450.0" y="488" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">选择有限原型并测试</text><path d="M690 445 H885 V73 H610" fill="none" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="450" y="580" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">未覆盖关键问题或测试失败 → 返回调查与发散</text></g></svg>