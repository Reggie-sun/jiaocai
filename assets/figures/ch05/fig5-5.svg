<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="815px" viewBox="0 0 900 815" role="img" aria-labelledby="title desc"><title id="title">创新史材料的证据类型与推论边界</title><desc id="desc">四种史料各自通向有限的可支持主张，并分别标出不能从该材料单独推出的结论；路径之间不做高低排名。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="815" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="450" y="35" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#202326">四类材料支持不同范围的论断</text><rect x="35" y="95" width="250" height="110" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="160.0" y="128" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">Stukeley回忆</text><text x="160.0" y="158" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">后来记述的谈话</text><rect x="325" y="95" width="250" height="110" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="128" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">苹果谈话的线索</text><text x="450.0" y="158" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">存在记忆距离</text><rect x="615" y="95" width="250" height="110" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="740.0" y="128" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">不能推出</text><text x="740.0" y="158" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">一次顿悟完成理论</text><line x1="291" y1="150" x2="315" y2="150" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="585" y1="150" x2="609" y2="150" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/><rect x="35" y="245" width="250" height="110" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="160.0" y="278" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">Orville当日日记</text><text x="160.0" y="308" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">飞行与计时记录</text><rect x="325" y="245" width="250" height="110" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="278" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">当时的观察</text><text x="450.0" y="308" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">保留计时不确定</text><rect x="615" y="245" width="250" height="110" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="740.0" y="278" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">不能推出</text><text x="740.0" y="308" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">完整航空发展脉络</text><line x1="291" y1="300" x2="315" y2="300" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="585" y1="300" x2="609" y2="300" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/><rect x="35" y="395" width="250" height="110" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="160.0" y="428" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">Smithsonian综述</text><text x="160.0" y="458" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">馆藏研究整理</text><rect x="325" y="395" width="250" height="110" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="428" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">观察、测量和试验</text><text x="450.0" y="458" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">研究过程的脉络</text><rect x="615" y="395" width="250" height="110" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="740.0" y="428" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">不能视为</text><text x="740.0" y="458" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">同日原始观察</text><line x1="291" y1="450" x2="315" y2="450" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="585" y1="450" x2="609" y2="450" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/><rect x="35" y="545" width="250" height="110" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="160.0" y="578" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">Jinek等实验论文</text><text x="160.0" y="608" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">2012年体外实验</text><rect x="325" y="545" width="250" height="110" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="578" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">特定实验中的</text><text x="450.0" y="608" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">RNA引导DNA切割</text><rect x="615" y="545" width="250" height="110" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="740.0" y="578" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">不能直接推出</text><text x="740.0" y="608" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">全部应用安全与伦理</text><line x1="291" y1="600" x2="315" y2="600" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="585" y1="600" x2="609" y2="600" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6"/><text x="450" y="733" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">先看材料记录，再限定推论，最后说明教学解释</text><text x="450" y="778" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">四行不是简单的证据高低排名</text></g></svg>