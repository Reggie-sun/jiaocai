<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="640px" viewBox="0 0 900 640" role="img" aria-labelledby="title desc"><title id="title">空间活动、照明区域与责任条件的关系</title><desc id="desc">阅读、讨论、通行、清洁和应急活动与座位区、通道、入口存在不同关系，部分关系需现场核验和责任人确认。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="640" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="450" y="36" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#202326">活动不同，照明责任也可能不同</text><text x="450" y="74" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">以下是待核验关系，不是校园空间实测图</text><text x="150" y="123" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">活动</text><text x="385" y="123" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">可能涉及空间</text><text x="650" y="123" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">需要确认的条件</text><rect x="35" y="165" width="220" height="70" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="145.0" y="198" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">阅读、讨论</text><rect x="285" y="165" width="245" height="70" rx="8" fill="#FFFFFF" stro