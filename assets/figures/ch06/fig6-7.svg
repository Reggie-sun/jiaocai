<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="580px" viewBox="0 0 900 580" role="img" aria-labelledby="title desc"><title id="title">四项里程碑与反馈、修订的时间线</title><desc id="desc">项目由需求报告、技术方案、原型或模拟推进到最终答辩；每个评审点都能把反馈带回上一版修订。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="580" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="450" y="35" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#202326">四项规定成果与反馈点</text><line x1="85" y1="125" x2="810" y2="125" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="120" cy="125" r="12" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><rect x="25" y="175" width="195" height="140" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="122.5" y="208" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">需求分析报告</text><text x="122.5" y="238" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">需求与来源</text><text x="122.5" y="268" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">第一次检查</text><circle cx="345" cy="125" r="12" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><rect x="250" y="175" width="195" height="140" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="347.5" y="208" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">技术方案设计书</text><text x="347.5" y="238" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">接口与可行性</text><text x="347.5" y="268" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">方案评审</text><circle cx="570" cy="125" r="12" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><rect x="475" y="175" width="195" height="140" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="572.5" y="208" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">原型演示/模拟</text><text x="572.5" y="238" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">测试与版本</text><text x="572.5" y="268" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">中期评审</text><circle cx="795" cy="125" r="12" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><rect x="700" y="175" width="195" height="140" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="797.5" y="208" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">最终答辩</text><text x="797.5" y="238" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">证据与限制</text><text x="797.5" y="268" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">展示与复盘</text><path d="M790 330 V390 H340 V330" fill="none" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M565 345 V445 H115 V330" fill="none" stroke="#1F4E79" stroke-width="2" strok