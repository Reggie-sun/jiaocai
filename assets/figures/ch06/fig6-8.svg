<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="635px" viewBox="0 0 900 635" role="img" aria-labelledby="title desc"><title id="title">PBL里程碑、能力表现与学习反思的关联</title><desc id="desc">抽象、分解、证据判断、协作和反思在多个里程碑重复出现，每项能力都关联到具体工件或决策证据。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="635" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="450" y="35" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#202326">能力表现必须落到实际工件</text><text x="90" y="95" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">阶段</text><text x="275" y="95" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">计算思维</text><text x="460" y="95" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">批判判断</text><text x="645" y="95" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">跨界协作</text><text x="825" y="95" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">反思问题</text><rect x="20" y="123" width="860" height="76" rx="0" fill="#F0F2F4" stroke="#555B61" stroke-width="2"/><text x="90" y="164" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">需求报告</text><text x="275" y="164" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">分解任务</text><text x="460" y="164" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">核验来源</text><text x="645" y="164" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">确认职责</text><text x="825" y="164" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">漏掉谁？</text><rect x="20" y="218" width="860" height="76" rx="0" fill="#FFFFFF" stroke="#555B61" stroke-width="2"/><text x="90" y="259" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">技术方案</text><text x="275" y="259" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">表示接口</text><text x="460" y="259" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">检查假设</text><text x="645" y="259" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">协调约束</text><text x="825" y="259" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">为何这样？</text><rect x="20" y="313" width="860" height="76" rx="0" fill="#F0F2F4" stroke="#555B61" stroke-width="2"/><text x="90" y="354" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">原型测试</text><text x="275" y="354" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">检查规则</text><text x="460" y="354" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">寻找反例</text><text x="645" y="354" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">解释失败</text><text x="825" y="354" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">改了什么？</text><rect x="20" y="408" width="860" height="76" rx="0" fill="#FFFFFF" stroke="#555B61" stroke-width="2"/><text x="90" y="449" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">最终答辩</text><text x="275" y="449" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">说明结构</text><text x="460" y="449" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">限定结论</text><text x="645" y="449" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">共同说明</text><text x="825" y="449" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">如何迁移？</text><text x="450" y="555" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">表中列出可观察的操作，不是学习效果评分</text><text x="450" y="600" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">同一能力在多个阶段反复出现，需用工件举证</text></g></svg>