<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="545px" viewBox="0 0 900 545" role="img" aria-labelledby="title desc"><title id="title">失败用例驱动的项目迭代与回归检查</title><desc id="desc">测试差异被追溯到根因，修订后重跑失败用例和已有正常用例，并将结果记录到新版本。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="545" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="450" y="35" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#202326">观察到的失败，才能成为修订的依据</text><rect x="30" y="90" width="180" height="100" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="120.0" y="123" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">触发输入</text><text x="120.0" y="153" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">保留版本</text><line x1="216" y1="140" x2="242" y2="140" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="250" y="90" width="180" height="100" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="340.0" y="123" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">预期与实际</text><text x="340.0" y="153" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">定位差异</text><line x1="436" y1="140" x2="462" y2="140" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="470" y="90" width="180" height="100" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="560.0" y="123" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">追踪根因</text><text x="560.0" y="153" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">修订规则</text><line x1="656" y1="140" x2="682" y2="140" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="690" y="90" width="180" height="100" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="780.0" y="123" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">回归检查</text><text x="780.0" y="153" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">记录证据</text><path d="M780 200 V260 H120 V200" fill="none" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="315" width="820" height="140" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="348" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">例1：D区保护对象 → 不产生可调整差值</text><text x="450.0" y="378" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">例2：候选小时增加 → 不得贴上“节能”标签</text><text x="450.0" y="408" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">修订后重跑原失败用例、正常用例和相邻条件</text><text x="450" y="511" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">一次通过只覆盖已运行的条件，不构成普遍可靠性证明</text></g></svg>