<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="500px" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">从项目愿望到验证证据的需求追踪链</title><desc id="desc">项目愿望依次关联用户关切、编号需求、系统响应、测试证据和答辩结论；未连接的节点表示待补证据。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="500" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="450" y="38" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#202326">每项需求都要连到可以查看的证据</text><rect x="20" y="85" width="145" height="100" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="92.5" y="118" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">用户关切</text><text x="92.5" y="148" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">说明来源</text><line x1="172" y1="135" x2="193" y2="135" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="200" y="85" width="145" height="100" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="272.5" y="118" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">需求编号</text><text x="272.5" y="148" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">验收条件</text><line x1="352" y1="135" x2="373" y2="135" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="380" y="85" width="145" height="100" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="452.5" y="118" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">模块响应</text><text x="452.5" y="148" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">责任边界</text><line x1="532" y1="135" x2="553" y2="135" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="560" y="85" width="145" height="100" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="632.5" y="118" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">测试用例</text><text x="632.5" y="148" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">实际输出</text><line x1="712" y1="135" x2="733" y2="135" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="740" y="85" width="145" height="100" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="812.5" y="118" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">答辩结论</text><text x="812.5" y="148" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">保留限制</text><rect x="40" y="245" width="390" height="100" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="235.0" y="278" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">R-01：分区电量估算</text><text x="235.0" y="308" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">手算 ↔ 计算模块 ↔ T01</text><rect x="470" y="245" width="390" height="100" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="665.0" y="278" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">R-02：保护条件优先</text><text x="665.0" y="308" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">保护状态 ↔ 审查模块 ↔ T02</text><text x="450" y="410" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">实线：已有教学契约；虚线：仍待取得的依据</text><line x1="160" y1="450" x2="350" y2="450" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="590" y="458" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">现场需求是否认可？尚待确认</text></g></svg>