<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="625px" viewBox="0 0 900 625" role="img" aria-labelledby="title desc"><title id="title">从功率与时长到电量及模拟金额的单位核算</title><desc id="desc">区域A先将864瓦换成0.864千瓦，乘运行小时和30天得到电量，再乘教学单价得到24.11元模拟差额。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="625" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="450" y="35" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#202326">A区：教学输入与独立手算</text><rect x="40" y="70" width="820" height="100" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="103" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">48盏 × 18 W/盏 ＝ 864 W ＝ 0.864 kW</text><text x="450.0" y="133" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">电量 ＝ 功率(kW) × 每天小时(h/天) × 天数(天)</text><text x="145" y="267" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">基线：12 h/天</text><rect x="255" y="245" width="482.112" height="38" rx="0" fill="#F0F2F4" stroke="#1F4E79" stroke-width="2"/><text x="807.1120000000001" y="272" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">311.04 kWh</text><text x="145" y="357" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">候选：10.5 h/天</text><rect x="255" y="335" width="421.84800000000007" height="38" rx="0" fill="url(#teaching)" stroke="#1F4E79" stroke-width="2"/><text x="746.8480000000001" y="362" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">272.16 kWh</text><line x1="255" y1="400" x2="797.5" y2="400" stroke="#555B61" stroke-width="2" stroke-linecap="round"/><line x1="255.0" y1="400" x2="255.0" y2="410" stroke="#555B61" stroke-width="2" stroke-linecap="round"/><text x="255.0" y="440" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">0</text><line x1="410.0" y1="400" x2="410.0" y2="410" stroke="#555B61" stroke-width="2" stroke-linecap="round"/><text x="410.0" y="440" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">100</text><line x1="565.0" y1="400" x2="565.0" y2="410" stroke="#555B61" stroke-width="2" stroke-linecap="round"/><text x="565.0" y="440" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">200</text><line x1="720.0" y1="400" x2="720.0" y2="410" stroke="#555B61" stroke-width="2" stroke-linecap="round"/><text x="720.0" y="440" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">300</text><text x="805" y="440" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">kWh</text><text x="450" y="500" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">30天差值：311.04 − 272.16 ＝ 38.88 kWh</text><text x="450" y="546" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">模拟金额：38.88 × 0.62 ＝ 24.1056元 → 24.11元</text><text x="450" y="591" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">价格为教学设定；柱长从0开始，不表示实测节能</text></g></svg>