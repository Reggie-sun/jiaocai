<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="535px" viewBox="0 0 900 535" role="img" aria-labelledby="title desc"><title id="title">教学数据、来源标记与结论边界</title><desc id="desc">教学字段先经单位和来源校验，再计算教学情景差值；结论旁保留实测设备、费率和运行条件待确认项。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="535" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><rect x="35" y="40" width="255" height="130" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="162.5" y="73" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">输入记录</text><text x="162.5" y="103" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">字段、单位、期间</text><text x="162.5" y="133" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">来源标记</text><rect x="325" y="40" width="250" height="130" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="73" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">校验与公式</text><text x="450.0" y="103" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">缺失不补猜测值</text><text x="450.0" y="133" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">单位先统一</text><rect x="610" y="40" width="255" height="130" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="737.5" y="73" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">教学估算</text><text x="737.5" y="103" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">仅在设定条件下</text><text x="737.5" y="133" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">保留输入版本</text><line x1="295" y1="105" x2="320" y2="105" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="580" y1="105" x2="605" y2="105" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="40" y="235" width="820" height="100" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="268" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">A区教学输入：48盏 × 18 W/盏；12与10.5 h/天；30天</text><text x="450.0" y="298" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">教学单价0.62元/kWh；这些数值不代表真实校园</text><rect x="40" y="400" width="820" height="100" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="433" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">待确认：灯具实测、运行条件、保护范围、实际费率</text><text x="450.0" y="463" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">正确复算 ≠ 已经测得现实节能效果</text><line x1="162" y1="229" x2="162" y2="185" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="80" y1="366" x2="820" y2="366" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 7"/></g></svg>