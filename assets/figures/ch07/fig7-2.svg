<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="615px" viewBox="0 0 900 615" role="img" aria-labelledby="title desc"><title id="title">图7-2 从学习经验到结论之间的证据层次</title><desc id="desc">依次查看“参加特定练习”“观察到脑影像变化”“技能表现变化”“迁移到另一任务”“某种教育干预普遍有效”几个层次。断开的箭头表示每一步都需要独立证据；前面一层得到支持，不自动意味着后面每一层成立。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="615" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="450" y="34" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#202326">五个不同问题，每个结论都须有自己的证据</text><rect x="35" y="65" width="575" height="75" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="55" y="95" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#202326">1  参加特定练习</text><text x="55" y="125" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">练习对象与条件是什么？</text><line x1="322" y1="144" x2="322" y2="150" stroke="#555B61" stroke-width="2" stroke-linecap="round"/><line x1="322" y1="158" x2="322" y2="163" stroke="#555B61" stroke-width="2" stroke-linecap="round"/><text x="650" y="157" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">另需独立证据</text><rect x="35" y="165" width="575" height="75" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="55" y="195" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#202326">2  观察到脑影像变化</text><text x="55" y="225" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">观察方法能说明什么？</text><line x1="322" y1="244" x2="322" y2="250" stroke="#555B61" stroke-width="2" stroke-linecap="round"/><line x1="322" y1="258" x2="322" y2="263" stroke="#555B61" stroke-width="2" stroke-linecap="round"/><text x="650" y="257" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">另需独立证据</text><rect x="35" y="265" width="575" height="75" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="55" y="295" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#202326">3  技能表现发生变化</text><text x="55" y="325" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">表现怎样测量与比较？</text><line x1="322" y1="344" x2="322" y2="350" stroke="#555B61" stroke-width="2" stroke-linecap="round"/><line x1="322" y1="358" x2="322" y2="363" stroke="#555B61" stroke-width="2" stroke-linecap="round"/><text x="650" y="357" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">另需独立证据</text><rect x="35" y="365" width="575" height="75" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="55" y="395" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#202326">4  迁移到另一任务</text><text x="55" y="425" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">新任务与原任务有何不同？</text><line x1="322" y1="444" x2="322" y2="450" stroke="#555B61" stroke-width="2" stroke-linecap="round"/><line x1="322" y1="458" x2="322" y2="463" stroke="#555B61" stroke-width="2" stroke-linecap="round"/><text x="650" y="457" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">另需独立证据</text><rect x="35" y="465" width="575" height="75" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="55" y="495" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#202326">5  某种教育干预普遍有效</text><text x="55" y="525" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">人群、环境与重复证据是否支持？</text><text x="450" y="583" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#202326">前一层得到支持，不自动证明后一层。</text></g></svg>