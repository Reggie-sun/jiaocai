<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="460px" viewBox="0 0 900 460" role="img" aria-labelledby="title desc"><title id="title">图7-6 群体差异与个人变化是两类证据</title><desc id="desc">左侧比较同一群体中不同人的评分差异，右侧追踪某一人多个时间点的评分。左侧的问题是变量怎样与群体差异相关，右侧的问题是某个人怎样变化、变化能否维持；不能把左侧的方差比例直接搬到右侧，当作个人配方。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="460" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><rect x="25" y="25" width="410" height="160" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="230.0" y="59" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">群体中的差异</text><text x="230.0" y="91" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">比较不同的人</text><text x="230.0" y="119" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">同一时期的评分</text><text x="230.0" y="147" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">问：哪些变量与差异有关？</text><rect x="465" y="25" width="410" height="160" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="670.0" y="59" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">个人随时间的变化</text><text x="670.0" y="91" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">追踪同一个人</text><text x="670.0" y="119" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">多个时期的评分</text><text x="670.0" y="147" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">问：变化怎样发生与维持？</text><rect x="65" y="220" width="100" height="60" rx="8" fill="#F0F2F4" stroke="#555B61" stroke-width="2"/><text x="115" y="258" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">甲</text><rect x="190" y="220" width="100" height="60" rx="8" fill="#F0F2F4" stroke="#555B61" stroke-width="2"/><text x="240" y="258" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">乙</text><rect x="315" y="220" width="100" height="60" rx="8" fill="#F0F2F4" stroke="#555B61" stroke-width="2"/><text x="365" y="258" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">丙</text><rect x="505" y="220" width="100" height="60" rx="8" fill="#F0F2F4" stroke="#555B61" stroke-width="2"/><text x="555" y="258" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">时点一</text><rect x="630" y="220" width="100" height="60" rx="8" fill="#F0F2F4" stroke="#555B61" stroke-width="2"/><text x="680" y="258" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">时点二</text><rect x="755" y="220" width="100" height="60" rx="8" fill="#F0F2F4" stroke="#555B61" stroke-width="2"/><text x="805" y="258" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">时点三</text><line x1="608" y1="250" x2="627" y2="250" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="733" y1="250" x2="752" y2="250" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="260" y1="335" x2="640" y2="335" stroke="#555B61" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 7"/><line x1="437" y1="322" x2="463" y2="348" stroke="#202326" stroke-width="3" stroke-linecap="round"/><line x1="437" y1="348" x2="463" y2="322" stroke="#202326" stroke-width="3" stroke-linecap="round"/><text x="450" y="389" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#202326">群体方差比例不能直接变成个人的幸福配方。</text><text x="450" y="427" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">结构示意，不包含实际评分或研究数据。</text></g></svg>