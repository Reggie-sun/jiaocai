<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="700px" viewBox="0 0 900 700" role="img" aria-labelledby="title desc"><title id="title">主张怎样通过材料与核验修订</title><desc id="desc">一个待检查主张分别关联来源及其支持范围、数量单位与推理前提、影响对象与行动权限；这些检查结果汇合后由人判断，图示路径不是自动裁决。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="700" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><rect x="300" y="30" width="300" height="76" rx="8" fill="#F0F2F4" stroke="#1F4E79" stroke-width="2"/><text x="450" y="77" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">待检查的主张</text><rect x="20" y="162" width="280" height="142" rx="8" fill="#FFFFFF" stroke="#555B61" stroke-width="2"/><text x="160" y="198" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#1F4E79">事实来源</text><text x="38" y="239" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">材料是否存在？</text><text x="38" y="269" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">它支持到什么范围？</text><line x1="450" y1="106" x2="160" y2="156" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="310" y="162" width="280" height="142" rx="8" fill="#FFFFFF" stroke="#555B61" stroke-width="2"/><text x="450" y="198" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#1F4E79">数量与逻辑</text><text x="328" y="239" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">单位、分母是否合适？</text><text x="328" y="269" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">推理补入了什么前提？</text><line x1="450" y1="106" x2="450" y2="156" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="600" y="162" width="280" height="142" rx="8" fill="#FFFFFF" stroke="#555B61" stroke-width="2"/><text x="740" y="198" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#1F4E79">影响对象与权限</text><text x="618" y="239" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">谁会承担后果？</text><text x="618" y="269" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">行动是否得到授权？</text><line x1="450" y1="106" x2="740" y2="156" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="220" y="357" width="460" height="88" rx="8" fill="#F0F2F4" stroke="#1F4E79" stroke-width="2"/><text x="450" y="392" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#1F4E79">依据具体证据、影响与权限作出判断</text><text x="450" y="425" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">三类检查结果汇合后再选处置</text><line x1="160" y1="304" x2="450" y2="336" stroke="#555B61" stroke-width="2" stroke-linecap="round"/><line x1="450" y1="304" x2="450" y2="336" stroke="#555B61" stroke-width="2" stroke-linecap="round"/><line x1="740" y1="304" x2="450" y2="336" stroke="#555B61" stroke-width="2" stroke-linecap="round"/><line x1="450" y1="336" x2="450" y2="350" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M450 445 V466 H117 H783" fill="none" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="117" y1="466" x2="117" y2="481" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="15" y="482" width="204" height="119" rx="8" fill="#FFFFFF" stroke="#555B61" stroke-width="2"/><text x="117" y="515" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">保留</text><text x="117" y="549" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">材料支持，且条件</text><text x="117" y="578" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">满足</text><line x1="339" y1="466" x2="339" y2="481" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="237" y="482" width="204" height="119" rx="8" fill="#FFFFFF" stroke="#555B61" stroke-width="2"/><text x="339" y="515" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">修正</text><text x="339" y="549" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">与证据矛盾或表述</text><text x="339" y="578" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">范围过强</text><line x1="561" y1="466" x2="561" y2="481" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="459" y="482" width="204" height="119" rx="8" fill="#FFFFFF" stroke="#555B61" stroke-width="2"/><text x="561" y="515" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">待调查</text><text x="561" y="549" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">资料、计算或范围</text><text x="561" y="578" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">仍待核</text><line x1="783" y1="466" x2="783" y2="481" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="681" y="482" width="204" height="119" rx="8" fill="#FFFFFF" stroke="#555B61" stroke-width="2"/><text x="783" y="515" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">暂停</text><text x="783" y="549" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">权限或可能后果尚</text><text x="783" y="578" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">不清楚</text><text x="450" y="642" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">处置由人按具体原因决定；补证据、修订主张或确认权限后再判断。</text><text x="450" y="678" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">图示路径辅助推理，不自动裁定主张可靠与否。</text></g></svg>