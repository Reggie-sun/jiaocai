<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="670px" viewBox="0 0 900 670" role="img" aria-labelledby="title desc"><title id="title">领域知识怎样改变表示与评价</title><desc id="desc">校园自习室服务的目标、表示、实施与评价构成可回返的设计链；计算机科学、数学、工程、科学、人文与社会知识分别标明其改变的环节，但角色可以重叠。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="670" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="450" y="38" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#202326">同一服务目标：帮助学生找到可使用的自习室</text><rect x="25" y="65" width="190" height="103" rx="8" fill="#F0F2F4" stroke="#1F4E79" stroke-width="2"/><text x="120" y="101" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="26px" font-weight="bold" fill="#1F4E79">目标</text><text x="120" y="130" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">谁要解决什么</text><text x="120" y="155" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">问题？</text><line x1="219" y1="116" x2="240" y2="116" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="245" y="65" width="190" height="103" rx="8" fill="#FFFFFF" stroke="#555B61" stroke-width="2"/><text x="340" y="101" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="26px" font-weight="bold" fill="#1F4E79">表示</text><text x="340" y="130" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">房间 / 座位 / 时间</text><line x1="439" y1="116" x2="460" y2="116" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="465" y="65" width="190" height="103" rx="8" fill="#FFFFFF" stroke="#555B61" stroke-width="2"/><text x="560" y="101" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="26px" font-weight="bold" fill="#1F4E79">实施</text><text x="560" y="130" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">更新 / 失联 / 恢复</text><line x1="659" y1="116" x2="680" y2="116" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="685" y="65" width="190" height="103" rx="8" fill="#F0F2F4" stroke="#1F4E79" stroke-width="2"/><text x="780" y="101" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="26px" font-weight="bold" fill="#1F4E79">评价</text><text x="780" y="130" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">空位 / 时效</text><text x="780" y="155" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">与可进入性</text><path d="M780 176 V222 H120 V176" fill="none" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><line x1="340" y1="222" x2="340" y2="176" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="450" y="258" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#1F4E79">测试和使用反馈可回到目标与表示</text><rect x="20" y="286" width="270" height="138" rx="8" fill="#FFFFFF" stroke="#555B61" stroke-width="2"/><text x="36" y="317" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">计算机科学</text><text x="36" y="348" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">环节：表示/实施</text><text x="36" y="381" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">房间、座位、时间表示</text><text x="36" y="409" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">可用、未知、失败分开</text><rect x="315" y="286" width="270" height="138" rx="8" fill="#FFFFFF" stroke="#555B61" stroke-width="2"/><text x="331" y="317" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">数学</text><text x="331" y="348" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">环节：表示/评价</text><text x="331" y="381" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">空位比较要明确分母</text><text x="331" y="409" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">并固定时间窗口径</text><rect x="610" y="286" width="270" height="138" rx="8" fill="#FFFFFF" stroke="#555B61" stroke-width="2"/><text x="626" y="317" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">工程</text><text x="626" y="348" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">环节：实施/评价</text><text x="626" y="381" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">处理失联、延迟与恢复</text><text x="626" y="409" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">规定响应时间和可用性</text><rect x="165" y="440" width="270" height="138" rx="8" fill="#FFFFFF" stroke="#555B61" stroke-width="2"/><text x="181" y="471" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">科学</text><text x="181" y="502" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">环节：目标/评价</text><text x="181" y="535" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">抽样比对记录与实际状态</text><text x="181" y="563" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">说明观察结论支持的范围</text><rect x="460" y="440" width="270" height="138" rx="8" fill="#FFFFFF" stroke="#555B61" stroke-width="2"/><text x="476" y="471" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">人文与社会</text><text x="476" y="502" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">环节：目标/表示/评价</text><text x="476" y="535" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">考虑无障碍、隐私与公平</text><text x="476" y="563" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">设置申诉和纠错路径</text><text x="450" y="633" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">知识环节并非互斥分工；一个人也可能带来多种视角。</text></g></svg>