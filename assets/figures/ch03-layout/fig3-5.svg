<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="710px" viewBox="0 0 900 710" role="img" aria-labelledby="title desc"><title id="title">不同教室的照明需要与可减少时间</title><desc id="desc">A、B原亮灯8小时，教学需要6小时，另有0.5小时准备与清场；C、D原亮灯8小时，教学需要5小时，另有0.5小时准备与清场。图中以同一0–8小时刻度显示统一减少3小时后剩余5小时的候选，保留练习判断。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="710" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="450" y="38" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#202326">共同时间尺度：0–8小时/日</text><text x="450" y="72" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">斜纹为教学需要；交叉纹为额外准备与清场0.5小时。</text><line x1="300" y1="112" x2="850" y2="112" stroke="#202326" stroke-width="2" stroke-linecap="round"/><line x1="300.0" y1="105" x2="300.0" y2="120" stroke="#202326" stroke-width="2" stroke-linecap="round"/><text x="300.0" y="98" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">0</text><line x1="368.75" y1="105" x2="368.75" y2="120" stroke="#202326" stroke-width="2" stroke-linecap="round"/><text x="368.75" y="98" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">1</text><line x1="437.5" y1="105" x2="437.5" y2="120" stroke="#202326" stroke-width="2" stroke-linecap="round"/><text x="437.5" y="98" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">2</text><line x1="506.25" y1="105" x2="506.25" y2="120" stroke="#202326" stroke-width="2" stroke-linecap="round"/><text x="506.25" y="98" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">3</text><line x1="575.0" y1="105" x2="575.0" y2="120" stroke="#202326" stroke-width="2" stroke-linecap="round"/><text x="575.0" y="98" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">4</text><line x1="643.75" y1="105" x2="643.75" y2="120" stroke="#202326" stroke-width="2" stroke-linecap="round"/><text x="643.75" y="98" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">5</text><line x1="712.5" y1="105" x2="712.5" y2="120" stroke="#202326" stroke-width="2" stroke-linecap="round"/><text x="712.5" y="98" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">6</text><line x1="781.25" y1="105" x2="781.25" y2="120" stroke="#202326" stroke-width="2" stroke-linecap="round"/><text x="781.25" y="98" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">7</text><line x1="850.0" y1="105" x2="850.0" y2="120" stroke="#202326" stroke-width="2" stroke-linecap="round"/><text x="850.0" y="98" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">8</text><line x1="20" y1="254" x2="875" y2="254" stroke="#D7DCE1" stroke-width="2" stroke-linecap="round"/><text x="24" y="171" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#1F4E79">教室 A</text><text x="24" y="203" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size