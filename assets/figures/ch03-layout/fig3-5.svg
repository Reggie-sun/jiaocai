#202326">准备/清场 0.5 h</text><rect x="300" y="526" width="550" height="30" rx="2" fill="#F0F2F4" stroke="#555B61" stroke-width="2"/><text x="575.0" y="549" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">原亮灯 8 h</text><rect x="300" y="560" width="343.75" height="23" fill="url(#teaching)" stroke="#1F4E79" stroke-width="2"/><rect x="643.75" y="560" width="34.375" height="23" fill="url(#extra)" stroke="#555B61" stroke-width="2"/><rect x="300" y="596" width="343.75" height="25" fill="#1F4E79" stroke="#1F4E79" stroke-width="2"/><text x="471.875" y="617" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#FFFFFF">统一候选 5 h</text><text x="450" y="680" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">按每间教室的分段需求检查候选时间。</text></g></svg>