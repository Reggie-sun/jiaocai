<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="650px" viewBox="0 0 900 650" role="img" aria-labelledby="title desc"><title id="title">跨设备指令与状态确认</title><desc id="desc">住户先授权手机或服务控制家中灯，服务发送关灯指令，设备执行后回传状态；若超时或离线而没有回传，界面显示状态未知，不把已发送当成已关闭。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="650" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><rect x="30" y="40" width="210" height="48" rx="8" fill="#F0F2F4" stroke="#1F4E79" stroke-width="2"/><text x="135" y="72" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#1F4E79">住户</text><line x1="135" y1="96" x2="135" y2="465" stroke="#D7DCE1" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 7"/><rect x="315" y="40" width="210" height="48" rx="8" fill="#F0F2F4" stroke="#1F4E79" stroke-width="2"/><text x="420" y="72" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#1F4E79">手机 / 服务</text><line x1="420" y1="96" x2="420" y2="465" stroke="#D7DCE1" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 7"/><rect x="605" y="40" width="210" height="48" rx="8" fill="#F0F2F4" stroke="#1F4E79" stroke-width="2"/><text x="710" y="72" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#1F4E79">家居设备</text><line x1="710" y1="96" x2="710" y2="465" stroke="#D7DCE1" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 7"/><text x="278" y="129" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">① 授权：允许控制这盏灯</text><line x1="145" y1="150" x2="408" y2="150" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="565" y="204" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">② 发送：关灯指令已送出</text><line x1="430" y1="225" x2="698" y2="225" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="600" y="262" width="220" height="78" rx="8" fill="#F0F2F4" stroke="#1F4E79" stroke-width="2"/><text x="710" y="293" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#1F4E79">③ 设备接收指令</text><text x="710" y="323" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#1F4E79">并执行动作</text><text x="565" y="367" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">④ 执行状态回传</text><line x1="700" y1="387" x2="432" y2="387" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="278" y="432" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">⑤ 收到回传后展示确认</text><line x1="408" y1="452" x2="145" y2="452" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M420 468 V493 H260 V516" fill="none" stroke="#555B61" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 7" marker-end="url(#arrow)"/><rect x="160" y="515" width="520" height="70" rx="8" fill="#FFFFFF" stroke="#555B61" stroke-width="2" stroke-dasharray="7 6"/><text x="420" y="545" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">若超时或离线，没有设备回传</text><text x="420" y="575" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#1F4E79">当前状态未知</text><text x="450" y="625" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">未确认 ≠ 已成功；不能把“已发送”写成“已关闭”。</text></g></svg>