<rect x="50" y="617" width="1300" height="194" rx="7" fill="#f5f5f5" stroke="#414141" stroke-width="2"/>
<text x="72" y="659" font-family="'Noto Sans CJK SC', 'Noto Sans CJK', sans-serif" font-size="28" fill="#202020" font-weight="700" text-anchor="start">新增条件：participants ≤ capacity；required_facilities ⊆ facilities</text>
<text x="72" y="703" font-family="'Noto Sans CJK SC', 'Noto Sans CJK', sans-serif" font-size="28" fill="#202020" font-weight="400" text-anchor="start">反例：Q3有20人，C1容量12。时段不冲突、有投影仍不能安排。</text>
<text x="72" y="747" font-family="'Noto Sans CJK SC', 'Noto Sans CJK', sans-serif" font-size="28" fill="#202020" font-weight="400" text-anchor="start">变体：C2降到18人后，Q3在两个场地都无位置；不能只换名字沿用旧解。</text>
<text x="50" y="858" font-family="'Noto Sans CJK SC', 'Noto Sans CJK', sans-serif" font-size="27" fill="#202020" font-weight="400" text-anchor="start">教学示例；箭头只表示字段或规则对应，不表示两个领域的条件完全相同。</text>
