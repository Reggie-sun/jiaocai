<polyline points="481,527 581,527" fill="none" stroke="#414141" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="595" y="494" width="540" height="66" rx="7" fill="#f5f5f5" stroke="#414141" stroke-width="2"/>
