<text x="265" y="283" font-family="'Noto Sans CJK SC', 'Noto Sans CJK', sans-serif" font-size="26" fill="#202020" font-weight="400" text-anchor="start">候选如何重复检查</text>
<text x="685" y="245" font-family="'Noto Sans CJK SC', 'Noto Sans CJK', sans-serif" font-size="26" fill="#202020" font-weight="400" text-anchor="start">字段、条件</text>
<text x="685" y="283" font-family="'Noto Sans CJK SC', 'Noto Sans CJK', sans-serif" font-size="26" fill="#202020" font-weight="400" text-anchor="start">实际检查结果</text>
<text x="1120" y="245" font-family="'Noto Sans CJK SC', 'Noto Sans CJK', sans-serif" font-size="26" fill="#202020" font-weight="400" text-anchor="start">模型内可行</text>
