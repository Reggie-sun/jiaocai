<text x="1120" y="503" font-family="'Noto Sans CJK SC', 'Noto Sans CJK', sans-serif" font-size="26" fill="#202020" font-weight="400" text-anchor="start">尚无因果证据</text>
<line x1="50" y1="536" x2="1350" y2="536" stroke="#7b7b7b" stroke-width="1.5"/>
