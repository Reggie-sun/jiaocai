<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="975" viewBox="0 0 1400 975">
<title>图1-6 不同思维视角需要的证据</title>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="none" stroke="#414141" stroke-width="1.5"/></marker></defs>
<rect width="1400" height="975" fill="white"/>
<text x="50" y="60" font-family="'Noto Sans CJK SC', 'Noto Sans CJK', sans-serif" font-size="36" fill="#202020" font-weight="700" text-anchor="start">图1-6  不同思维视角需要的证据</text>
<text x="50" y="119" font-family="'Noto Sans CJK SC', 'Noto Sans CJK', sans-serif" font-size="27" fill="#202020" font-weight="400" text-anchor="start">同一照明问题可同时使用多个视角；下面是本书教学综合，不是互斥分类。</text>
