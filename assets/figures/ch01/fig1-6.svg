<line x1="50" y1="646" x2="1350" y2="646" stroke="#7b7b7b" stroke-width="1.5"/>
<text x="55" y="693" font-family="'Noto Sans CJK SC', 'Noto Sans CJK', sans-serif" font-size="29" fill="#202020" font-weight="700" text-anchor="start">设计</text>
<text x="265" y="685" font-family="'Noto Sans CJK SC', 'Noto Sans CJK', sans-serif" font-size="26" fill="#202020" font-weight="400" text-anchor="start">使用者怎样体验</text>
<text x="265" y="723" font-family="'Noto Sans CJK SC', 'Noto Sans CJK', sans-serif" font-size="26" fill="#202020" font-weight="400" text-anchor="start">候选怎样修改</text>
<text x="685" y="685" font-family="'Noto Sans CJK SC', 'Noto Sans CJK', sans-serif" font-size="26" fill="#202020" font-weight="400" text-anchor="start">用户任务</text>
<text x="685" y="723" font-family="'Noto Sans CJK SC', 'Noto Sans CJK', sans-serif" font-size="26" fill="#202020" font-weight="400" text-anchor="start">原型与反馈</text>
<text x="1120" y="685" font-family="'Noto Sans CJK SC', 'Noto Sans CJK', sans-serif" font-size="26" fill="#202020" font-weight="400" text-anchor="start">需要真实验证</text>
<text x="1120" y="723" font-family="'Noto Sans CJK SC', 'Noto Sans CJK', sans-serif" font-size="26" fill="#202020" font-weight="400" text-anchor="start">不能假定需求</text>
