<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="535px" viewBox="0 0 900 535" role="img" aria-labelledby="title desc"><title id="title">图9-4 团队决策的约束过滤与复核流程</title><desc id="desc">先检查硬约束，未满足或未知的候选先暂停；再比较偏好与证据，记录决定者和理由；新条件触发时返回约束检查。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="535" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><rect x="30" y="25" width="280" height="90" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="170.0" y="59" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">候选方案</text><text x="170.0" y="91" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">明确目标与范围</text><rect x="30" y="155" width="280" height="115" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="170.0" y="189" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">硬约束检查</text><text x="170.0" y="221" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">权限、安全与期限</text><text x="170.0" y="249" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">已满足还是仍未知？</text><rect x="525" y="155" width="340" height="115" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2" stroke-dasharray="7 6"/><text x="695.0" y="189" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">暂停候选</text><text x="695.0" y="221" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">未满足或关键条件未知</text><text x="695.0" y="249" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">补证据、调整或退出</text><rect x="30" y="320" width="280" height="90" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="170.0" y="354" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">比较偏好与证据</text><text x="170.0" y="386" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">收益、成本与不确定性</text><rect x="525" y="320" width="340" height="90" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="695.0" y="354" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">记录决定</text><text x="695.0" y="386" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">决定者、理由与复核条件</text><line x1="170" y1="120" x2="170" y2="150" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="315" y1="210" x2="520" y2="210" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="415" y="192" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">未满足 / 未知</text><line x1="170" y1="275" x2="170" y2="315" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="270" y="301" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">满足</text><line x1="315" y1="365" x2="520" y2="365" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M695 415 V458 H15 V210 H25" fill="none" stroke="#555B61" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="450" y="501" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">新条件触发复核时，返回硬约束检查。</text></g></svg>