<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610" role="img" aria-labelledby="title desc"><title id="title">图2-2状态扩展示意</title><desc id="desc">图示两层状态图。普通移动在同一服务进度层内进行；只有在C办理服务时，状态从C,0跨到C,1。上方直接路线到P需2分钟，但出口X,0不满足已服务条件；下方起点经C办理后到P的整段共5分钟，从P到出口的时间未在此示意中给定，最终目标仍为X,1。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,3 L0,6 z" fill="#1F4E79"/></marker><pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#777777"/></pattern></defs><rect width="900" height="610" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="450" y="47" text-anchor="middle" font-size="25" font-weight="bold" fill="#222222">普通移动保留服务进度；办理服务才跨层</text><rect x="35" y="78" width="830" height="190" rx="8" fill="white" stroke="#777777" stroke-width="2.5" stroke-dasharray="9 6"/><rect x="35" y="305" width="830" height="170" rx="8" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="58" y="108" text-anchor="start" font-size="22" font-weight="bold" fill="#222222">s=0：尚未完成服务</text><text x="58" y="335" text-anchor="start" font-size="22" font-weight="bold" fill="#222222">s=1：已经完成服务</text><rect x="92" y="142" width="112" height="54" rx="8" fill="white" stroke="#222222" stroke-width="2.5"/><text x="148.0" y="177.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">起点 S,0</text><rect x="452" y="144" width="68" height="60" rx="4" fill="white" stroke="#222222" stroke-width="3" stroke-dasharray="9 5"/><text x="486" y="182" text-anchor="middle" font-size="24" font-weight="bold" fill="#222222">P,0</text><rect x="752" y="144" width="68" height="60" rx="4" fill="white" stroke="#222222" stroke-width="3" stroke-dasharray="9 5"/><text x="786" y="182" text-anchor="middle" font-size="24" font-weight="bold" fill="#222222">X,0</text><circle cx="280" cy="224" r="34" fill="white" stroke="#222222" stroke-width="3"/><text x="280" y="232" text-anchor="middle" font-size="24" font-weight="bold" fill="#222222">C,0</text><line x1="204" y1="169" x2="450" y2="169" stroke="#1F4E79" stroke-width="3.0" marker-end="url(#arrow)"/><text x="328" y="151" text-anchor="middle" font-size="22" font-weight="bold" fill="#222222">总计2分钟</text><line x1="522" y1="174" x2="746" y2="174" stroke="#1F4E79" stroke-width="3.0" marker-end="url(#arrow)"/><line x1="194" y1="189" x2="246" y2="213" stroke="#1F4E79" stroke-width="3.0" marker-end="url(#arrow)"/><text x="786" y="223" text-anchor="middle" font-size="22" font-weight="bold" fill="#222222">不满足已服务目标</text><line x1="280" y1="258" x2="280" y2="345" stroke="#1F4E79" stroke-width="3.0" marker-end="url(#arrow)"/><text x="352" y="289" text-anchor="start" font-size="22" font-weight="bold" fill="#1F4E79">办理完成：s=0→1</text><circle cx="280" cy="379" r="34" fill="white" stroke="#222222" stroke-width="3"/><text x="280" y="387" text-anchor="middle" font-size="24" font-weight="bold" fill="#222222">C,1</text><circle cx="486" cy="379" r="34" fill="white" stroke="#222222" stroke-width="3"/><text x="486" y="387" text-anchor="middle" font-size="24" font-weight="bold" fill="#222222">P,1</text><circle cx="786" cy="379" r="34" fill="white" stroke="#222222" stroke-width="3"/><text x="786" y="387" text-anchor="middle" font-size="24" font-weight="bold" fill="#222222">X,1</text><line x1="314" y1="379" x2="450" y2="379" stroke="#1F4E79" stroke-width="3.0" marker-end="url(#arrow)"/><line x1="520" y1="379" x2="750" y2="379" stroke="#1F4E79" stroke-width="3.0" marker-end="url(#arrow)"/><text x="450" y="455" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F4E79">起点经C办理服务后到P：总计5分钟（含服务；不拆分路段）</text><rect x="80" y="502" width="740" height="89" rx="8" fill="white" stroke="#222222" stroke-width="2.5"/><text x="450.0" y="539.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">同一地点P的(P,0)与(P,1)必须分别保留</text><text x="450.0" y="570.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">目标是(X,1)；不能只因位置相同就合并两种状态</text></g></svg>