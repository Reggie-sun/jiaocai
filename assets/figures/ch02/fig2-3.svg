<svg xmlns="http://www.w3.org/2000/svg" width="900" height="545" viewBox="0 0 900 545" role="img" aria-labelledby="title desc"><title id="title">图2-3依赖示意</title><desc id="desc">A读入快照后分支到B节点规范与C通行规则；D计算路线依赖B和C，E说明依赖B；F端到端检查依赖D和E；G发布依赖F。模块虚线框表示封装边界，B与C都标注map=M1，C另标profile=C1，D要求输入版本兼容。图不表示耗时或关键链。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,3 L0,6 z" fill="#1F4E79"/></marker><pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#777777"/></pattern></defs><rect width="900" height="545" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="450" y="45" text-anchor="middle" font-size="24" font-weight="bold" fill="#222222">处理环节由有向边连接；模块实现由边界封装</text><line x1="144.0" y1="230.23595505617976" x2="201.5" y2="191.79494382022472" stroke="#1F4E79" stroke-width="3.0" marker-end="url(#arrow)"/><line x1="144.0" y1="297.7191011235955" x2="201.5" y2="333.8988764044944" stroke="#1F4E79" stroke-width="3.0" marker-end="url(#arrow)"/><line x1="310.72727272727275" y1="194.0" x2="425.27272727272725" y2="329.0" stroke="#1F4E79" stroke-width="3.0" marker-end="url(#arrow)"/><line x1="338.5" y1="377.0" x2="395.0" y2="377.0" stroke="#1F4E79" stroke-width="3.0" marker-end="url(#arrow)"/><line x1="338.5" y1="146.0" x2="397.5" y2="146.0" stroke="#1F4E79" stroke-width="3.0" marker-end="url(#arrow)"/><line x1="537.0" y1="334.247311827957" x2="582.25" y2="307.0" stroke="#1F4E79" stroke-width="3.0" marker-end="url(#arrow)"/><line x1="531.6470588235294" y1="188.0" x2="586.3529411764706" y2="223.0" stroke="#1F4E79" stroke-width="3.0" marker-end="url(#arrow)"/><line x1="725.0" y1="265.0" x2="764.5" y2="265.0" stroke="#1F4E79" stroke-width="3.0" marker-end="url(#arrow)"/><rect x="40.0" y="223.0" width="104" height="84" rx="8" fill="white" stroke="#222222" stroke-width="2.5"/><text x="92.0" y="257.5" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">A</text><text x="92.0" y="288.5" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">读入快照</text><rect x="201.5" y="98.0" width="137" height="96" rx="8" fill="white" stroke="#1F4E79" stroke-width="2.5" stroke-dasharray="9 6"/><text x="270.0" y="123.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">B</text><text x="270.0" y="154.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">节点规范</text><text x="270.0" y="185.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">map=M1</text><rect x="201.5" y="329.0" width="137" height="96" rx="8" fill="white" stroke="#1F4E79" stroke-width="2.5" stroke-dasharray="9 6"/><text x="270.0" y="354.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">C</text><text x="270.0" y="385.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">通行规则</text><text x="270.0" y="416.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">map=M1 / C1</text><rect x="395.0" y="329.0" width="142" height="96" rx="8" fill="white" stroke="#1F4E79" stroke-width="2.5" stroke-dasharray="9 6"/><text x="466.0" y="354.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">D</text><text x="466.0" y="385.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">计算路线</text><text x="466.0" y="416.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">需版本兼容</text><rect x="397.5" y="104.0" width="137" height="84" rx="8" fill="white" stroke="#1F4E79" stroke-width="2.5" stroke-dasharray="9 6"/><text x="466.0" y="138.5" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">E</text><text x="466.0" y="169.5" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">生成说明</text><rect x="579.0" y="223.0" width="146" height="84" rx="8" fill="white" stroke="#222222" stroke-width="2.5"/><text x="652.0" y="257.5" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">F</text><text x="652.0" y="288.5" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">端到端检查</text><rect x="764.5" y="223.0" width="91" height="84" rx="8" fill="white" stroke="#222222" stroke-width="2.5"/><text x="810.0" y="257.5" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">G</text><text x="810.0" y="288.5" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">发布</text><text x="466" y="477" text-anchor="middle" font-size="22" font-weight="bold" fill="#222222">B、C向D提供的数据须兼容；箭头表示依赖，不表示执行耗时</text><text x="466" y="514" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">虚线边框圈出封装模块；内部实现可变，对外承诺保持可组合</text></g></svg>