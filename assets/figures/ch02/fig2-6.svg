<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" role="img" aria-labelledby="title desc"><title id="title">图2-6讲解示例</title><desc id="desc">五个成对请求的基线时间为6、7、8、9、10分钟，候选为5、6、7分钟后两个失败；故成功均值分别为8与6分钟，覆盖率分别为5/5与3/5，共同成功的前三个请求候选各快1分钟。未给分组标签，因此不作分组统计。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,3 L0,6 z" fill="#1F4E79"/></marker><pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#777777"/></pattern></defs><rect width="900" height="720" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="450" y="47" text-anchor="middle" font-size="25" font-weight="bold" fill="#222222">同一批五个请求：时间与覆盖分开看</text><text x="450" y="82" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">讲解示例数据；“失败”表示没有合格路线，不计入成功平均</text><text x="130" y="126" text-anchor="middle" font-size="22" font-weight="bold" fill="#222222">请求</text><text x="280" y="126" text-anchor="middle" font-size="22" font-weight="bold" fill="#222222">基线B</text><text x="440" y="126" text-anchor="middle" font-size="22" font-weight="bold" fill="#222222">候选C</text><text x="602" y="126" text-anchor="middle" font-size="22" font-weight="bold" fill="#222222">配对状态</text><text x="757" y="126" text-anchor="middle" font-size="22" font-weight="bold" fill="#222222">分组</text><line x1="83" y1="139" x2="817" y2="139" stroke="#222222" stroke-width="2.5"/><text x="130" y="181" text-anchor="middle" font-size="23" font-weight="bold" fill="#222222">R1</text><text x="280" y="181" text-anchor="middle" font-size="23" font-weight="normal" fill="#222222">6分</text><text x="440" y="181" text-anchor="middle" font-size="23" font-weight="bold" fill="#1F4E79">5分</text><text x="602" y="181" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">共同成功</text><text x="757" y="181" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">未提供</text><text x="130" y="236" text-anchor="middle" font-size="23" font-weight="bold" fill="#222222">R2</text><text x="280" y="236" text-anchor="middle" font-size="23" font-weight="normal" fill="#222222">7分</text><text x="440" y="236" text-anchor="middle" font-size="23" font-weight="bold" fill="#1F4E79">6分</text><text x="602" y="236" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">共同成功</text><text x="757" y="236" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">未提供</text><text x="130" y="291" text-anchor="middle" font-size="23" font-weight="bold" fill="#222222">R3</text><text x="280" y="291" text-anchor="middle" font-size="23" font-weight="normal" fill="#222222">8分</text><text x="440" y="291" text-anchor="middle" font-size="23" font-weight="bold" fill="#1F4E79">7分</text><text x="602" y="291" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">共同成功</text><text x="757" y="291" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">未提供</text><text x="130" y="346" text-anchor="middle" font-size="23" font-weight="bold" fill="#222222">R4</text><text x="280" y="346" text-anchor="middle" font-size="23" font-weight="normal" fill="#222222">9分</text><text x="440" y="346" text-anchor="middle" font-size="23" font-weight="normal" fill="#222222">失败</text><text x="602" y="346" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">仅B成功</text><text x="757" y="346" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">未提供</text><line x1="105" y1="374" x2="790" y2="374" stroke="#777777" stroke-width="1.8" stroke-dasharray="10 7"/><text x="130" y="401" text-anchor="middle" font-size="23" font-weight="bold" fill="#222222">R5</text><text x="280" y="401" text-anchor="middle" font-size="23" font-weight="normal" fill="#222222">10分</text><text x="440" y="401" text-anchor="middle" font-size="23" font-weight="normal" fill="#222222">失败</text><text x="602" y="401" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">仅B成功</text><text x="757" y="401" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">未提供</text><rect x="45" y="477" width="810" height="78" rx="8" fill="white" stroke="#222222" stroke-width="2.5"/><text x="450.0" y="524.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">成功均值：B=(6+7+8+9+10)/5=8分钟；C=(5+6+7)/3=6分钟</text><rect x="45" y="574" width="390" height="77" rx="8" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="240.0" y="605.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">覆盖：B 5/5</text><text x="240.0" y="636.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">C 3/5</text><rect x="465" y="574" width="390" height="77" rx="8" fill="white" stroke="#222222" stroke-width="2.5"/><text x="660.0" y="605.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">共同成功R1–R3</text><text x="660.0" y="636.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">C比B各快1分钟</text><text x="450" y="690" text-anchor="middle" font-size="22" font-weight="bold" fill="#222222">本例未提供通行条件分组标签；真实分组需另有数据，不能由图推造</text></g></svg>