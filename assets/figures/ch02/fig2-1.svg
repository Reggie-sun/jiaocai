<svg xmlns="http://www.w3.org/2000/svg" width="900" height="455" viewBox="0 0 900 455" role="img" aria-labelledby="title desc"><title id="title">图2-1教学示意</title><desc id="desc">同一资料中心在粗略模型中只有一个节点，北门和南门被合并；入口模型保留西门到北门3分钟且有台阶、到南门7分钟且无台阶，以及两门间绕行4分钟。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,3 L0,6 z" fill="#1F4E79"/></marker><pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#777777"/></pattern></defs><rect width="900" height="455" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="225" y="52" text-anchor="middle" font-size="25" font-weight="bold" fill="#222222">建筑级：适合粗略定位</text><text x="675" y="52" text-anchor="middle" font-size="25" font-weight="bold" fill="#222222">入口级：支持通行判断</text><rect x="24" y="82" width="402" height="340" rx="8" fill="white" stroke="#777777" stroke-width="2.5" stroke-dasharray="9 6"/><rect x="474" y="82" width="402" height="340" rx="8" fill="white" stroke="#777777" stroke-width="2.5" stroke-dasharray="9 6"/><circle cx="90" cy="230" r="34" fill="white" stroke="#222222" stroke-width="3"/><text x="90" y="238" text-anchor="middle" font-size="24" font-weight="bold" fill="#222222">西门</text><rect x="239" y="183" width="160" height="94" rx="8" fill="white" stroke="#222222" stroke-width="2.5"/><text x="319.0" y="222.5" text-anchor="middle" font-size="23" font-weight="normal" fill="#222222">资料中心</text><text x="319.0" y="253.5" text-anchor="middle" font-size="23" font-weight="normal" fill="#222222">入口已合并</text><line x1="162.0" y1="230.0" x2="203.0" y2="230.0" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="137.5" y="188" width="89" height="30" rx="4" fill="white" stroke="none"/><text x="182" y="210" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">3分钟</text><text x="225" y="324" text-anchor="middle" font-size="23" font-weight="normal" fill="#222222">可答：大致到达建筑</text><text x="225" y="362" text-anchor="middle" font-size="23" font-weight="normal" fill="#222222">不能答：是否无台阶通行</text><circle cx="525" cy="230" r="34" fill="white" stroke="#222222" stroke-width="3"/><text x="525" y="238" text-anchor="middle" font-size="24" font-weight="bold" fill="#222222">西门</text><circle cx="798" cy="160" r="34" fill="white" stroke="#222222" stroke-width="3"/><text x="798" y="168" text-anchor="middle" font-size="24" font-weight="bold" fill="#222222">N</text><circle cx="798" cy="300" r="34" fill="white" stroke="#222222" stroke-width="3"/><text x="798" y="308" text-anchor="middle" font-size="24" font-weight="bold" fill="#222222">M</text><line x1="596.925130005232" y1="209.268717498692" x2="727.074869994768" y2="176.731282501308" stroke="#222222" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="607.5" y="146" width="89" height="30" rx="4" fill="white" stroke="none"/><text x="652" y="168" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">3分钟</text><line x1="596.925130005232" y1="249.731282501308" x2="727.074869994768" y2="282.268717498692" stroke="#1F4E79" stroke-width="5.0" marker-end="url(#arrow)"/><rect x="635.5" y="328" width="89" height="30" rx="4" fill="white" stroke="none"/><text x="680" y="350" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F4E79">7分钟</text><line x1="798" y1="194" x2="798" y2="266" stroke="#1F4E79" stroke-width="3.0" marker-end="url(#arrow)"/><text x="846" y="222" text-anchor="middle" font-size="22" font-weight="bold" fill="#222222">外绕</text><text x="846" y="249" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">4分钟</text><text x="798" y="111" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">北门：有台阶</text><text x="798" y="355" text-anchor="middle" font-size="22" font-weight="bold" fill="#222222">南门：无台阶</text><text x="675" y="394" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F4E79">无台阶任务选M；3分钟路线不合格</text></g></svg>