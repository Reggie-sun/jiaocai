<svg xmlns="http://www.w3.org/2000/svg" width="900" height="690" viewBox="0 0 900 690" role="img" aria-labelledby="title desc"><title id="title">图2-7状态示意</title><desc id="desc">提交前拒绝表示无外部效果；提交后确认成功则记录结果；断连/超时进入UNKNOWN，先查询原操作ID。查询确认未执行且重试语义安全时才允许同ID重试；查明已执行则结束；仍无法确认时继续暂停。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,3 L0,6 z" fill="#1F4E79"/></marker><pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#777777"/></pattern></defs><rect width="900" height="690" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="450" y="47" text-anchor="middle" font-size="25" font-weight="bold" fill="#222222">自动流程必须区分未提交、已确认与结果未知</text><rect x="38" y="103" width="202" height="84" rx="8" fill="white" stroke="#222222" stroke-width="2.5"/><text x="139.0" y="137.5" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">提交前检查</text><text x="139.0" y="168.5" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">判断是否可提交</text><rect x="348" y="103" width="205" height="84" rx="8" fill="white" stroke="#222222" stroke-width="2.5"/><text x="450.5" y="137.5" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">提交</text><text x="450.5" y="168.5" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">保留原操作ID</text><rect x="658" y="103" width="204" height="84" rx="8" fill="#F1F3F5" stroke="#222222" stroke-width="2.5"/><text x="760.0" y="153.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">等待权威确认</text><rect x="34" y="238" width="218" height="84" rx="8" fill="white" stroke="#222222" stroke-width="2.5" stroke-dasharray="9 6"/><text x="143.0" y="272.5" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">明确拒绝</text><text x="143.0" y="303.5" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">确定尚无外部效果</text><rect x="340" y="238" width="220" height="84" rx="8" fill="white" stroke="#1F4E79" stroke-width="2.5"/><text x="450.0" y="272.5" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">确认已应用</text><text x="450.0" y="303.5" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">结束并记录</text><rect x="650" y="238" width="220" height="108" rx="8" fill="white" stroke="#1F4E79" stroke-width="2.5" stroke-dasharray="9 6"/><text x="760.0" y="269.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">断连或超时</text><text x="760.0" y="300.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">UNKNOWN</text><text x="760.0" y="331.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">暂停重试</text><line x1="240" y1="145" x2="348" y2="145" stroke="#1F4E79" stroke-width="3.0" marker-end="url(#arrow)"/><text x="294" y="137" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">符合</text><line x1="553" y1="145" x2="658" y2="145" stroke="#1F4E79" stroke-width="3.0" marker-end="url(#arrow)"/><line x1="139" y1="187" x2="139" y2="238" stroke="#1F4E79" stroke-width="3.0" marker-end="url(#arrow)"/><text x="181" y="221" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">拒绝</text><line x1="730" y1="187" x2="450" y2="238" stroke="#1F4E79" stroke-width="3.0" marker-end="url(#arrow)"/><line x1="760" y1="187" x2="760" y2="238" stroke="#1F4E79" stroke-width="3.0" stroke-dasharray="10 7" marker-end="url(#arrow)"/><text x="824" y="218" text-anchor="end" font-size="22" font-weight="normal" fill="#222222">未知</text><rect x="338" y="369" width="224" height="77" rx="8" fill="white" stroke="#222222" stroke-width="2.5" stroke-dasharray="9 6"/><text x="450.0" y="400.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">使用原操作ID查询</text><text x="450.0" y="431.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">权威状态</text><line x1="760" y1="346" x2="510" y2="369" stroke="#1F4E79" stroke-width="3.0" stroke-dasharray="10 7" marker-end="url(#arrow)"/><line x1="450" y1="446" x2="142" y2="490" stroke="#1F4E79" stroke-width="3.0" marker-end="url(#arrow)"/><rect x="34" y="490" width="218" height="126" rx="8" fill="white" stroke="#222222" stroke-width="2.5"/><text x="143.0" y="514.5" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">确认未执行</text><text x="143.0" y="545.5" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">确认无在途请求</text><text x="143.0" y="576.5" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">幂等契约允许</text><text x="143.0" y="607.5" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">才可有限次同ID重试</text><line x1="450" y1="446" x2="450" y2="490" stroke="#1F4E79" stroke-width="3.0" marker-end="url(#arrow)"/><rect x="340" y="490" width="218" height="126" rx="8" fill="white" stroke="#222222" stroke-width="2.5"/><text x="449.0" y="530.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">确认已应用</text><text x="449.0" y="561.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">记录外部结果</text><text x="449.0" y="592.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">结束</text><line x1="450" y1="446" x2="756" y2="490" stroke="#1F4E79" stroke-width="3.0" stroke-dasharray="10 7" marker-end="url(#arrow)"/><rect x="646" y="490" width="218" height="126" rx="8" fill="white" stroke="#1F4E79" stroke-width="2.5" stroke-dasharray="9 6"/><text x="755.0" y="530.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">仍无法确认</text><text x="755.0" y="561.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">保持暂停</text><text x="755.0" y="592.0" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">不自动重试</text><path d="M34 553 H17 V80 H450 V103" fill="none" stroke="#1F4E79" stroke-width="2.5" marker-end="url(#arrow)"/><text x="450" y="665" text-anchor="middle" font-size="22" font-weight="bold" fill="#222222">计时器或暂时查无记录都不能证明未执行；证据不足时继续停留在UNKNOWN</text></g></svg>