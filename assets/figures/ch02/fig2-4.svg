<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550" role="img" aria-labelledby="title desc"><title id="title">图2-4适用范围示意</title><desc id="desc">概念性的二维输入空间。虚线轮廓表示当前有样本支持的局部范围，实心圆表示该范围内的观察，空心圆表示邻近边界而待核验的样本，叉号表示未观测或例外的范围外位置。轮廓不提供数值阈值或统计置信区间。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,3 L0,6 z" fill="#1F4E79"/></marker><pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#777777"/></pattern></defs><rect width="900" height="550" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="450" y="46" text-anchor="middle" font-size="25" font-weight="bold" fill="#222222">规则只在有支持的局部输入范围内使用</text><path d="M205 305 C180 222 242 127 365 119 C495 92 611 143 635 228 C663 311 594 371 479 380 C359 390 236 373 205 305 Z" fill="#F1F3F5" stroke="#1F4E79" stroke-width="3" stroke-dasharray="11 7"/><text x="420" y="154" text-anchor="middle" font-size="23" font-weight="bold" fill="#1F4E79">局部观察支持范围</text><line x1="124" y1="408" x2="781" y2="408" stroke="#222222" stroke-width="2.5"/><line x1="124" y1="408" x2="124" y2="87" stroke="#222222" stroke-width="2.5"/><text x="790" y="435" text-anchor="end" font-size="22" font-weight="normal" fill="#222222">输入特征 a</text><text transform="rotate(-90 62 264)" x="62" y="264" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#222222">输入特征 b</text><circle cx="270" cy="274" r="9" fill="#222222" stroke="#222222" stroke-width="2"/><circle cx="321" cy="221" r="9" fill="#222222" stroke="#222222" stroke-width="2"/><circle cx="355" cy="310" r="9" fill="#222222" stroke="#222222" stroke-width="2"/><circle cx="416" cy="254" r="9" fill="#222222" stroke="#222222" stroke-width="2"/><circle cx="464" cy="335" r="9" fill="#222222" stroke="#222222" stroke-width="2"/><circle cx="517" cy="222" r="9" fill="#222222" stroke="#222222" stroke-width="2"/><circle cx="557" cy="286" r="9" fill="#222222" stroke="#222222" stroke-width="2"/><circle cx="219" cy="187" r="10" fill="white" stroke="#1F4E79" stroke-width="3"/><circle cx="604" cy="202" r="10" fill="white" stroke="#1F4E79" stroke-width="3"/><circle cx="580" cy="346" r="10" fill="white" stroke="#1F4E79" stroke-width="3"/><path d="M718,152 L736,170 M736,152 L718,170" stroke="#222222" stroke-width="3"/><path d="M686,283 L704,301 M704,283 L686,301" stroke="#222222" stroke-width="3"/><path d="M151,327 L169,345 M169,327 L151,345" stroke="#222222" stroke-width="3"/><text x="236" y="190" text-anchor="start" font-size="22" font-weight="normal" fill="#1F4E79">边缘待核验</text><text x="746" y="169" text-anchor="start" font-size="22" font-weight="bold" fill="#1F4E79">先复核</text><rect x="182" y="447" width="536" height="78" rx="8" fill="white" stroke="#222222" stroke-width="2.5"/><text x="450.0" y="478.5" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">实心点：范围内观察   空心点：边界待核验   ×：范围外</text><text x="450.0" y="509.5" text-anchor="middle" font-size="22" font-weight="normal" fill="#222222">边界只是教学示意，不是阈值或统计置信区间</text></g></svg>