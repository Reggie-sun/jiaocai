<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="490px" viewBox="0 0 900 490" role="img" aria-labelledby="title desc"><title id="title">三类检查的证据对象</title><desc id="desc">同一画方形任务分别检查理想几何条件、四次前进与右转的指令轨迹，以及尚待现场记录的真实运动；图中不提供伪造的实测轨迹或误差。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker></defs><rect width="900" height="490" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="450" y="39" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#202326">同一任务：画一个方形；证据对象各不相同</text><rect x="18" y="68" width="280" height="400" rx="8" fill="#FFFFFF" stroke="#202326" stroke-width="2.1"/><text x="158.0" y="102" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#1F4E79">数学约定</text><rect x="310" y="68" width="280" height="400" rx="8" fill="#FFFFFF" stroke="#202326" stroke-width="2.1"/><text x="450.0" y="102" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#1F4E79">指令轨迹</text><rect x="602" y="68" width="280" height="400" rx="8" fill="#FFFFFF" stroke="#202326" stroke-width="2.1"/><text x="742.0" y="102" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#1F4E79">真实移动观察</text><line x1="110" y1="222" x2="110" y2="132" stroke="#202326" stroke-width="3" stroke-linecap="round"/><line x1="110" y1="132" x2="200" y2="132" stroke="#202326" stroke-width="3" stroke-linecap="round"/><line x1="200" y1="132" x2="200" y2="222" stroke="#202326" stroke-width="3" stroke-linecap="round"/><line x1="200" y1="222" x2="110" y2="222" stroke="#202326" stroke-width="3" stroke-linecap="round"/><text x="158" y="252" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#1F4E79">理想方形</text><text x="158" y="291" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">四段等长</text><text x="158" y="318" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">每次转向90°</text><text x="158" y="345" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">从同一点开始</text><line x1="44" y1="362" x2="272" y2="362" stroke="#D7DCE1" stroke-width="1.5" stroke-linecap="round"/><text x="158" y="396" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">依据条件作推理</text><text x="158" y="426" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">检查角与闭合关系</text><line x1="405" y1="222" x2="405" y2="132" stroke="#1F4E79" stroke-width="3.0" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="405" y1="132" x2="495" y2="132" stroke="#1F4E79" stroke-width="3.0" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="495" y1="132" x2="495" y2="222" stroke="#1F4E79" stroke-width="3.0" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="495" y1="222" x2="405" y2="222" stroke="#1F4E79" stroke-width="3.0" stroke-linecap="round" marker-end="url(#arrow)"/><text x="450" y="252" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#1F4E79">按顺序执行</text><text x="450" y="291" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">每段前进相同长度</text><text x="450" y="321" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">每次右转90°，共4次</text><line x1="336" y1="362" x2="564" y2="362" stroke="#D7DCE1" stroke-width="1.5" stroke-linecap="round"/><text x="450" y="396" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">逐步重演指令</text><text x="450" y="426" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">检查次数、顺序与停止</text><line x1="697" y1="222" x2="697" y2="132" stroke="#555B61" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="8 6"/><line x1="697" y1="132" x2="787" y2="132" stroke="#555B61" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="8 6"/><line x1="787" y1="132" x2="787" y2="222" stroke="#555B61" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="8 6"/><line x1="787" y1="222" x2="697" y2="222" stroke="#555B61" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="8 6"/><text x="742" y="252" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">目标路线：方形</text><text x="742" y="282" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#1F4E79">实测轨迹：待记录</text><rect x="628" y="296" width="115" height="34" rx="3" fill="#F0F2F4" stroke="#D7DCE1" stroke-width="1.3"/><text x="685" y="320" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">起点与环境</text><rect x="756" y="296" width="115" height="34" rx="3" fill="#F0F2F4" stroke="#D7DCE1" stroke-width="1.3"/><text x="813" y="320" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">实际轨迹</text><rect x="628" y="336" width="115" height="34" rx="3" fill="#F0F2F4" stroke="#D7DCE1" stroke-width="1.3"/><text x="685" y="360" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">终点位置</text><rect x="756" y="336" width="115" height="34" rx="3" fill="#F0F2F4" stroke="#D7DCE1" stroke-width="1.3"/><text x="813" y="360" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">测量方法</text><line x1="628" y1="390" x2="856" y2="390" stroke="#D7DCE1" stroke-width="1.5" stroke-linecap="round"/><text x="742" y="422" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">需现场观察与测量</text><text x="742" y="451" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">本图没有实测数据</text></g></svg>