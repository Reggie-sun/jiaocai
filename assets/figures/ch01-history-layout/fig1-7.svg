<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="725px" viewBox="0 0 900 725" role="img" aria-labelledby="title desc"><title id="title">同一展览决定中的四种视角</title><desc id="desc">以“公告板为什么失灵”为原拟标题，中心展示“几段经历中的纸面通知”这一暂定修订示例：批判视角核对证据范围，设计视角检查首次观看者理解，系统视角看通知路径与反馈，计算视角记录来源、许可和核验；四者平行相连，不排序。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker></defs><rect width="900" height="725" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="450" y="36" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#202326">四种并列提问；连线不表示先后或高低</text><line x1="420" y1="245" x2="287" y2="267" stroke="#555B61" stroke-width="2.2" stroke-linecap="round"/><line x1="480" y1="245" x2="613" y2="267" stroke="#555B61" stroke-width="2.2" stroke-linecap="round"/><line x1="420" y1="485" x2="287" y2="452" stroke="#555B61" stroke-width="2.2" stroke-linecap="round"/><line x1="480" y1="485" x2="613" y2="452" stroke="#555B61" stroke-width="2.2" stroke-linecap="round"/><rect x="20" y="70" width="400" height="174" rx="10" fill="#FFFFFF" stroke="#555B61" stroke-width="2.1"/><text x="220" y="104" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#1F4E79">批判思维</text><text x="220" y="146" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">这项标题有多少证据？</text><text x="220" y="176" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">个体经历不能推出全体。</text><rect x="480" y="70" width="400" height="174" rx="10" fill="#FFFFFF" stroke="#555B61" stroke-width="2.1"/><text x="680" y="104" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#1F4E79">设计思维</text><text x="680" y="146" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">新同学会怎样理解？</text><text x="680" y="176" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">能否区分口述与空白样表？</text><rect x="20" y="485" width="400" height="174" rx="10" fill="#FFFFFF" stroke="#555B61" stroke-width="2.1"/><text x="220" y="519" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#1F4E79">系统思维</text><text x="220" y="561" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">改动怎样传到成员？</text><text x="220" y="591" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">是否看见路径与反馈缺口？</text><rect x="480" y="485" width="400" height="174" rx="10" fill="#FFFFFF" stroke="#555B61" stroke-width="2.1"/><text x="680" y="519" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#1F4E79">计算思维</text><text x="680" y="561" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">来源、许可、版本如何记录？</text><text x="680" y="591" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">标题判断怎样逐项核对？</text><rect x="250" y="267" width="400" height="185" rx="12" fill="#F0F2F4" stroke="#1F4E79" stroke-width="2.5"/><text x="450" y="302" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#1F4E79">同一标题决定</text><text x="450" y="336" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">原拟：公告板为什么失灵</text><text x="450" y="370" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">修订示例：几段经历中的纸面通知</text><text x="450" y="404" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">范围：两段模拟个人经历</text><text x="450" y="435" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">加一张空白样表，不代表全体</text><text x="450" y="689" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">乙仅同意印出原句，不同意录音；图中无声音材料。</text></g></svg>