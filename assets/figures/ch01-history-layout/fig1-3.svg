<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="675px" viewBox="0 0 900 675" role="img" aria-labelledby="title desc"><title id="title">历史问题与思想的联系</title><desc id="desc">紧凑时间表区分1890、图灵论文1936收稿/宣读与1937卷册著录、1948、1955、帕佩特著作1980初版与1993第二版、2006等年份；年份标识清楚，行间距不按年份比例，节点相邻不表示因果。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker></defs><rect width="900" height="675" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="450" y="35" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#202326">沿时间次序阅读问题、贡献和边界</text><rect x="17" y="58" width="140" height="47" rx="2" fill="#1F4E79" stroke="#FFFFFF" stroke-width="1.3"/><text x="87.0" y="89" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#FFFFFF">时间点</text><rect x="157" y="58" width="215" height="47" rx="2" fill="#1F4E79" stroke="#FFFFFF" stroke-width="1.3"/><text x="264.5" y="89" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#FFFFFF">当时的问题</text><rect x="372" y="58" width="291" height="47" rx="2" fill="#1F4E79" stroke="#FFFFFF" stroke-width="1.3"/><text x="517.5" y="89" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#FFFFFF">一项贡献或设想</text><rect x="663" y="58" width="220" height="47" rx="2" fill="#1F4E79" stroke="#FFFFFF" stroke-width="1.3"/><text x="773.0" y="89" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#FFFFFF">需要保留的边界</text><rect x="17" y="105" width="140" height="83" rx="1" fill="#F0F2F4" stroke="#D7DCE1" stroke-width="1.5"/><text x="87.0" y="154" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#1F4E79">1890</text><rect x="157" y="105" width="215" height="83" rx="1" fill="#F0F2F4" stroke="#D7DCE1" stroke-width="1.5"/><text x="167" y="134" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">普查资料增多，</text><text x="167" y="161" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">怎样汇总特征？</text><rect x="372" y="105" width="291" height="83" rx="1" fill="#F0F2F4" stroke="#D7DCE1" stroke-width="1.5"/><text x="382" y="134" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">穿孔卡记录字段；</text><text x="382" y="161" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">电气制表计数。</text><rect x="663" y="105" width="220" height="83" rx="1" fill="#F0F2F4" stroke="#D7DCE1" stroke-width="1.5"/><text x="673" y="134" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">转录、分类与</text><text x="673" y="161" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">解释仍须核验。</text><rect x="17" y="188" width="140" height="83" rx="1" fill="#FFFFFF" stroke="#D7DCE1" stroke-width="1.5"/><text x="87.0" y="223" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#1F4E79">1936</text><text x="87.0" y="250" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#1F4E79">1937</text><rect x="157" y="188" width="215" height="83" rx="1" fill="#FFFFFF" stroke="#D7DCE1" stroke-width="1.5"/><text x="167" y="217" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">机械计算的含义</text><text x="167" y="244" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">怎样形式化？</text><rect x="372" y="188" width="291" height="83" rx="1" fill="#FFFFFF" stroke="#D7DCE1" stroke-width="1.5"/><text x="382" y="217" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">1936收稿/宣读；</text><text x="382" y="244" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">1937卷册著录；简化模型。</text><rect x="663" y="188" width="220" height="83" rx="1" fill="#FFFFFF" stroke="#D7DCE1" stroke-width="1.5"/><text x="673" y="217" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">模型讨论计算性质，</text><text x="673" y="244" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">不是现实设备性能。</text><rect x="17" y="271" width="140" height="83" rx="1" fill="#F0F2F4" stroke="#D7DCE1" stroke-width="1.5"/><text x="87.0" y="320" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#1F4E79">1948</text><rect x="157" y="271" width="215" height="83" rx="1" fill="#F0F2F4" stroke="#D7DCE1" stroke-width="1.5"/><text x="167" y="300" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">消息怎样在通信中</text><text x="167" y="327" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">得到复现？</text><rect x="372" y="271" width="291" height="83" rx="1" fill="#F0F2F4" stroke="#D7DCE1" stroke-width="1.5"/><text x="382" y="300" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">分析传递、噪声</text><text x="382" y="327" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">与表示问题。</text><rect x="663" y="271" width="220" height="83" rx="1" fill="#F0F2F4" stroke="#D7DCE1" stroke-width="1.5"/><text x="673" y="300" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">表示传对不等于</text><text x="673" y="327" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">语义判断为真。</text><rect x="17" y="354" width="140" height="83" rx="1" fill="#FFFFFF" stroke="#D7DCE1" stroke-width="1.5"/><text x="87.0" y="403" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#1F4E79">1955</text><rect x="157" y="354" width="215" height="83" rx="1" fill="#FFFFFF" stroke="#D7DCE1" stroke-width="1.5"/><text x="167" y="383" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">机器能否使用语言、</text><text x="167" y="410" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">学习并改进？</text><rect x="372" y="354" width="291" height="83" rx="1" fill="#FFFFFF" stroke="#D7DCE1" stroke-width="1.5"/><text x="382" y="383" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">提案设想1956年夏</text><text x="382" y="410" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">开展AI研究。</text><rect x="663" y="354" width="220" height="83" rx="1" fill="#FFFFFF" stroke="#D7DCE1" stroke-width="1.5"/><text x="673" y="383" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">研究提案不是</text><text x="673" y="410" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">已经实现的能力。</text><rect x="17" y="437" width="140" height="83" rx="1" fill="#F0F2F4" stroke="#D7DCE1" stroke-width="1.5"/><text x="87.0" y="472" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#1F4E79">1980</text><text x="87.0" y="499" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#1F4E79">1993</text><rect x="157" y="437" width="215" height="83" rx="1" fill="#F0F2F4" stroke="#D7DCE1" stroke-width="1.5"/><text x="167" y="466" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">计算机能否成为</text><text x="167" y="493" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">学习与探索工具？</text><rect x="372" y="437" width="291" height="83" rx="1" fill="#F0F2F4" stroke="#D7DCE1" stroke-width="1.5"/><text x="382" y="466" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">1980初版提出愿景；</text><text x="382" y="493" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">1993年第二版。</text><rect x="663" y="437" width="220" height="83" rx="1" fill="#F0F2F4" stroke="#D7DCE1" stroke-width="1.5"/><text x="673" y="466" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">教育主张与版本信息</text><text x="673" y="493" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">都不证明学习效果。</text><rect x="17" y="520" width="140" height="83" rx="1" fill="#FFFFFF" stroke="#D7DCE1" stroke-width="1.5"/><text x="87.0" y="569" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#1F4E79">2006</text><rect x="157" y="520" width="215" height="83" rx="1" fill="#FFFFFF" stroke="#D7DCE1" stroke-width="1.5"/><text x="167" y="549" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">计算思维如何进入</text><text x="167" y="576" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">更广泛的教育？</text><rect x="372" y="520" width="291" height="83" rx="1" fill="#FFFFFF" stroke="#D7DCE1" stroke-width="1.5"/><text x="382" y="549" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">Wing倡议面向所有人，</text><text x="382" y="576" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">并指出超出编程。</text><rect x="663" y="520" width="220" height="83" rx="1" fill="#FFFFFF" stroke="#D7DCE1" stroke-width="1.5"/><text x="673" y="549" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">倡议不是发明起点，</text><text x="673" y="576" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">也非效果证明。</text><text x="450" y="633" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#1F4E79">节点先后不是因果；行距不按年份比例。</text></g></svg>