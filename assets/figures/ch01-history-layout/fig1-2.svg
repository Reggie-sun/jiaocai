<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="540px" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">同一查找问题的表示与执行</title><desc id="desc">三种方式都用同一目录与查找目标，分别按用途、难度和位置组织信息；预期候选均为K01和K03，并须回到原卡核对。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker></defs><rect width="900" height="540" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><rect x="25" y="34" width="850" height="56" rx="8" fill="#F0F2F4" stroke="#1F4E79" stroke-width="2.0"/><text x="450" y="70" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#1F4E79">找出入门的访谈准备资料与使用前确认资料</text><rect x="24" y="105" width="268" height="370" rx="8" fill="#FFFFFF" stroke="#202326" stroke-width="2.1"/><text x="158.0" y="135" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">纸卡</text><rect x="34" y="143" width="248" height="80" rx="4" fill="#F0F2F4" stroke="#D7DCE1" stroke-width="1.5"/><text x="49" y="174" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">输入</text><text x="115" y="164" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">六张原卡</text><text x="115" y="189" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">人工可读信息</text><rect x="34" y="224" width="248" height="80" rx="4" fill="#FFFFFF" stroke="#D7DCE1" stroke-width="1.5"/><text x="49" y="255" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">规则</text><text x="115" y="245" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">两个用途分别查</text><text x="115" y="270" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">保留入门候选</text><rect x="34" y="305" width="248" height="80" rx="4" fill="#F0F2F4" stroke="#D7DCE1" stroke-width="1.5"/><text x="49" y="336" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">输出</text><text x="115" y="326" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">K01、K03</text><text x="115" y="351" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">标题与架位</text><rect x="34" y="386" width="248" height="80" rx="4" fill="#FFFFFF" stroke="#D7DCE1" stroke-width="1.5"/><text x="49" y="417" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">核对</text><text x="115" y="407" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">另一位同学</text><text x="115" y="432" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">按架位实地查找</text><rect x="316" y="105" width="268" height="370" rx="8" fill="#FFFFFF" stroke="#202326" stroke-width="2.1"/><text x="450.0" y="135" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">表格</text><rect x="326" y="143" width="248" height="80" rx="4" fill="#F0F2F4" stroke="#D7DCE1" stroke-width="1.5"/><text x="341" y="174" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">输入</text><text x="407" y="164" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">行：K01—K06</text><text x="407" y="189" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">列：用途、难度</text><text x="407" y="214" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">以及位置</text><rect x="326" y="224" width="248" height="80" rx="4" fill="#FFFFFF" stroke="#D7DCE1" stroke-width="1.5"/><text x="341" y="255" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">规则</text><text x="407" y="245" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">用途分别筛选</text><text x="407" y="270" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">难度=入门</text><rect x="326" y="305" width="248" height="80" rx="4" fill="#F0F2F4" stroke="#D7DCE1" stroke-width="1.5"/><text x="341" y="336" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">输出</text><text x="407" y="326" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">K01、K03</text><text x="407" y="351" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">筛选后记录</text><rect x="326" y="386" width="248" height="80" rx="4" fill="#FFFFFF" stroke="#D7DCE1" stroke-width="1.5"/><text x="341" y="417" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">核对</text><text x="407" y="407" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">对照原卡</text><text x="407" y="432" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">核对字段和位置</text><rect x="608" y="105" width="268" height="370" rx="8" fill="#FFFFFF" stroke="#202326" stroke-width="2.1"/><text x="742.0" y="135" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">程序</text><rect x="618" y="143" width="248" height="80" rx="4" fill="#F0F2F4" stroke="#D7DCE1" stroke-width="1.5"/><text x="633" y="174" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">输入</text><text x="699" y="164" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">同一结构化目录</text><text x="699" y="189" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">卡号与字段值</text><rect x="618" y="224" width="248" height="80" rx="4" fill="#FFFFFF" stroke="#D7DCE1" stroke-width="1.5"/><text x="633" y="255" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">规则</text><text x="699" y="245" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">按用途分别筛</text><text x="699" y="270" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">再选难度=入门</text><rect x="618" y="305" width="248" height="80" rx="4" fill="#F0F2F4" stroke="#D7DCE1" stroke-width="1.5"/><text x="633" y="336" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">输出</text><text x="699" y="326" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">K01、K03</text><text x="699" y="351" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">匹配列表</text><rect x="618" y="386" width="248" height="80" rx="4" fill="#FFFFFF" stroke="#D7DCE1" stroke-width="1.5"/><text x="633" y="417" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">核对</text><text x="699" y="407" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">先写预期列表</text><text x="699" y="432" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">再对照原卡核验</text><text x="450" y="514" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">三种表示面对同一目录与目标；结果相同，核对仍不能省略。</text></g></svg>