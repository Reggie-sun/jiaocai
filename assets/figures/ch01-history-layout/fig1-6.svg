="75" rx="8" fill="#F0F2F4" stroke="#1F4E79" stroke-width="2"/><text x="450" y="459" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#1F4E79">共同关系：把材料组织成一致、可查找的表示</text><text x="450" y="488" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">按当前任务核对结果</text><rect x="30" y="520" width="840" height="143" rx="8" fill="#FFFFFF" stroke="#202326" stroke-width="2"/><text x="450" y="552" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#202326">两种任务并非完全同构</text><line x1="450" y1="568" x2="450" y2="644" stroke="#D7DCE1" stroke-width="1.5" stroke-linecap="round"/><text x="235" y="594" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">织造：固定0/1规则</text><text x="235" y="623" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">图案可逐格对照</text><text x="665" y="594" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">访谈：时间可能未确认</text><text x="665" y="623" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">保留原句与确定程度</text></g></svg>