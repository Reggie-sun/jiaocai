<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="505px" viewBox="0 0 900 505" role="img" aria-labelledby="title desc"><title id="title">资料卡查找的几层结果</title><desc id="desc">图中只列本次查找用到的目录字段（用途、难度、卡号、架位）。它们用于筛出K01和K03，并以编号和架位定位原卡；目录只支持定位，关于授权内容的判断仍须阅读K03全文。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker></defs><rect width="900" height="505" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="450" y="38" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#202326">先用目录找线索，再回原卡核对内容</text><rect x="22" y="71" width="255" height="114" rx="8" fill="#F0F2F4" stroke="#1F4E79" stroke-width="2.0"/><text x="149" y="104" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#1F4E79">两个查找需要</text><text x="149" y="137" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">访谈准备</text><text x="149" y="166" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">使用前确认</text><line x1="149" y1="187" x2="149" y2="210" stroke="#1F4E79" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="22" y="218" width="255" height="262" rx="8" fill="#FFFFFF" stroke="#555B61" stroke-width="2.0"/><text x="149" y="251" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">本次查找用到的字段</text><text x="149" y="282" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">用途 · 难度 · 卡号</text><text x="149" y="310" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">架位</text><text x="149" y="345" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">两个用途分开筛</text><text x="149" y="373" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">保留入门候选</text><rect x="43" y="386" width="213" height="48" rx="6" fill="#F0F2F4" stroke="#1F4E79" stroke-width="2.0"/><text x="149" y="417" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#1F4E79">K01、K03</text><text x="149" y="455" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">具体内容要读原卡</text><rect x="315" y="71" width="563" height="409" rx="8" fill="#FAFBFC" stroke="#202326" stroke-width="2.3"/><text x="596" y="105" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#202326">六张原卡的资料范围</text><rect x="338" y="124" width="516" height="183" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2.2"/><text x="596" y="155" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#1F4E79">目录命中的原卡子集</text><rect x="356" y="169" width="480" height="53" rx="5" fill="#F0F2F4" stroke="#555B61" stroke-width="2.0"/><text x="374" y="202" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">K01</text><text x="438" y="202" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">采访准备 · 入门 · 架一层左侧</text><rect x="356" y="234" width="480" height="53" rx="5" fill="#F0F2F4" stroke="#555B61" stroke-width="2.0"/><text x="374" y="267" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">K03</text><text x="438" y="267" text-anchor="start" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">使用前确认 · 入门 · 架二层左侧</text><line x1="278" y1="334" x2="326" y2="334" stroke="#1F4E79" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arrow)"/><text x="596" y="339" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">其余卡片：K02 · K04 · K05 · K06</text><rect x="338" y="365" width="516" height="91" rx="8" fill="#F0F2F4" stroke="#1F4E79" stroke-width="2.0"/><text x="596" y="399" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">读K03原文，才能核对授权范围</text><text x="596" y="432" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#1F4E79">找到卡片 ≠ 已确认卡片内容</text></g></svg>