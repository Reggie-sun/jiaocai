<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="615px" viewBox="0 0 900 615" role="img" aria-labelledby="title desc"><title id="title">图8-5 从外部学习节点到个人判断的反馈网络</title><desc id="desc">从一个具体学习问题出发，观察它怎样连接来源、同伴、社区和实践反馈，再回到学习者自己的判断和贡献。节点之间的连线不等于证据相互独立；需要继续追溯共同引用的原始来源。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="615" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><rect x="15" y="190" width="220" height="95" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="125.0" y="224" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">具体学习问题</text><text x="125.0" y="256" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">任务与当前困难</text><rect x="645" y="190" width="240" height="95" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="765.0" y="224" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">个人判断</text><text x="765.0" y="256" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">核验、整理与贡献</text><line x1="235" y1="237" x2="318" y2="60" stroke="#555B61" stroke-width="2" stroke-linecap="round"/><line x1="582" y1="60" x2="645" y2="237" stroke="#555B61" stroke-width="2" stroke-linecap="round"/><rect x="325" y="15" width="250" height="90" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="49" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">来源</text><text x="450.0" y="81" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">原始说明与研究</text><line x1="235" y1="237" x2="318" y2="190" stroke="#555B61" stroke-width="2" stroke-linecap="round"/><line x1="582" y1="190" x2="645" y2="237" stroke="#555B61" stroke-width="2" stroke-linecap="round"/><rect x="325" y="145" width="250" height="90" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="179" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">同伴</text><text x="450.0" y="211" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">复述与互查</text><line x1="235" y1="237" x2="318" y2="320" stroke="#555B61" stroke-width="2" stroke-linecap="round"/><line x1="582" y1="320" x2="645" y2="237" stroke="#555B61" stroke-width="2" stroke-linecap="round"/><rect x="325" y="275" width="250" height="90" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="309" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">社区</text><text x="450.0" y="341" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">有边界的提问</text><line x1="235" y1="237" x2="318" y2="450" stroke="#555B61" stroke-width="2" stroke-linecap="round"/><line x1="582" y1="450" x2="645" y2="237" stroke="#555B61" stroke-width="2" stroke-linecap="round"/><rect x="325" y="405" width="250" height="90" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="439" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">实践反馈</text><text x="450.0" y="471" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">实际任务的结果</text><path d="M765 290 V535 H125 V290" fill="none" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="450" y="578" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">提问与贡献形成往返；多个节点可能引用同一来源。</text></g></svg>