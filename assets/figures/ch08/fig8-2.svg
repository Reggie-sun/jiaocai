<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="390px" viewBox="0 0 900 390" role="img" aria-labelledby="title desc"><title id="title">图8-2 一次学习如何连接讲解、延迟提取与应用</title><desc id="desc">沿时间线观察每次活动的区别：先理解材料，再在资料关闭时尝试提取，随后核对并修正，最后把知识用于变化后的任务。若某次提取失败，应根据错误类型修改下一次活动，而不是只增加同一种重读。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="390" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="450" y="33" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#202326">示例安排：日期只表示教学顺序，不是最佳间隔</text><line x1="105" y1="115" x2="795" y2="115" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="110" y="83" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#202326">第1天</text><rect x="104" y="109" width="12" height="12" rx="6" fill="#1F4E79" stroke="#1F4E79" stroke-width="2"/><rect x="5" y="150" width="210" height="115" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="110.0" y="184" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">理解</text><text x="110.0" y="216" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">读材料与示例</text><text x="110.0" y="244" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">写出关键关系</text><text x="335" y="83" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#202326">第3天</text><rect x="329" y="109" width="12" height="12" rx="6" fill="#1F4E79" stroke="#1F4E79" stroke-width="2"/><rect x="230" y="150" width="210" height="115" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="335.0" y="184" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">提取</text><text x="335.0" y="216" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">关闭资料作答</text><text x="335.0" y="244" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">暴露遗漏与错误</text><text x="560" y="83" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#202326">第7天</text><rect x="554" y="109" width="12" height="12" rx="6" fill="#1F4E79" stroke="#1F4E79" stroke-width="2"/><rect x="455" y="150" width="210" height="115" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="560.0" y="184" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">核对与修正</text><text x="560.0" y="216" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">回看材料</text><text x="560.0" y="244" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">改解释与练习</text><text x="785" y="83" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#202326">第14天</text><rect x="779" y="109" width="12" height="12" rx="6" fill="#1F4E79" stroke="#1F4E79" stroke-width="2"/><rect x="680" y="150" width="210" height="115" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="785.0" y="184" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">变化任务应用</text><text x="785.0" y="216" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">换输入或情境</text><text x="785.0" y="244" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">检查能否迁移</text><path d="M785 275 V313 H335 V275" fill="none" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="450" y="354" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">根据错误类型改活动；无需只增加同一种重读。</text></g></svg>