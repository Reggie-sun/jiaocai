<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="330px" viewBox="0 0 900 330" role="img" aria-labelledby="title desc"><title id="title">图8-1 从外部变化到个人学习行动的判断路径</title><desc id="desc">从“技术或岗位信号”向右追踪，先区分调查预期、组织采用和具体任务；只有发现与目标任务有关的差距后，才进入学习行动和表现检查。若中间证据缺失，应把问题标为待核实，而不是直接扩大个人学习清单。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="330" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><rect x="30" y="15" width="840" height="58" rx="8" fill="#F0F2F4" stroke="#555B61" stroke-width="2"/><text x="450" y="51" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#202326">调查预期、组织采用与个人任务属于不同层次</text><rect x="35.0" y="120" width="150" height="110" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="110.0" y="154" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">外部信号</text><text x="110.0" y="186" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">预期或采用</text><line x1="188.0" y1="175" x2="201.0" y2="175" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="110.0" y1="78" x2="110.0" y2="113" stroke="#555B61" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="205.0" y="120" width="150" height="110" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="280.0" y="154" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">具体任务</text><text x="280.0" y="186" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">工作怎样变</text><line x1="358.0" y1="175" x2="371.0" y2="175" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="280.0" y1="78" x2="280.0" y2="113" stroke="#555B61" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="375.0" y="120" width="150" height="110" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="154" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">能力差距</text><text x="450.0" y="186" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">当前做不到</text><line x1="528.0" y1="175" x2="541.0" y2="175" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="450.0" y1="78" x2="450.0" y2="113" stroke="#555B61" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="545.0" y="120" width="150" height="110" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="620.0" y="154" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">学习行动</text><text x="620.0" y="186" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">练习与资源</text><line x1="698.0" y1="175" x2="711.0" y2="175" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="620.0" y1="78" x2="620.0" y2="113" stroke="#555B61" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#arrow)"/><rect x="715.0" y="120" width="150" height="110" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="790.0" y="154" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">表现检查</text><text x="790.0" y="186" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">独立完成</text><line x1="790.0" y1="78" x2="790.0" y2="113" stroke="#555B61" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5" marker-end="url(#arrow)"/><path d="M790.0 238 V265 H450.0 V238" fill="none" stroke="#1F4E79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="450" y="302" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">证据缺失时先核实；检查结果可以修订学习目标。</text></g></svg>