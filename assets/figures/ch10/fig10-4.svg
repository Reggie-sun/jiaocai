<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="525px" viewBox="0 0 900 525" role="img" aria-labelledby="title desc"><title id="title">图10-4 AI风险管理中的横向治理与循环复核</title><desc id="desc">把GOVERN看成贯穿责任、规则与问责的治理功能；沿MAP、MEASURE、MANAGE理解场景识别、风险检查和应对，再沿监测反馈回到情境与责任检查。使用对象或环境变化时，不能只沿原路线继续执行。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="525" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><rect x="25" y="20" width="850" height="420" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2" stroke-dasharray="7 6"/><rect x="65" y="45" width="770" height="85" rx="8" fill="#F0F2F4" stroke="#1F4E79" stroke-width="2"/><text x="450" y="79" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="25px" font-weight="bold" fill="#202326">GOVERN  治理</text><text x="450" y="112" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="normal" fill="#202326">责任、规则与问责贯穿全部功能</text><rect x="60" y="175" width="240" height="115" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="180.0" y="209" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">MAP  情境</text><text x="180.0" y="241" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">使用情境</text><text x="180.0" y="269" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">与影响对象</text><rect x="330" y="175" width="240" height="115" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="209" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">MEASURE  检查</text><text x="450.0" y="241" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">性能与风险</text><text x="450.0" y="269" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">方法及证据边界</text><rect x="600" y="175" width="240" height="115" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="720.0" y="209" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">MANAGE  应对</text><text x="720.0" y="241" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">限制、缓解</text><text x="720.0" y="269" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">监测或停止</text><line x1="305" y1="232" x2="325" y2="232" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="575" y1="232" x2="595" y2="232" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M720 297 V345 H180 V297" fill="none" stroke="#555B61" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="450" y="385" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">使用、情境或新证据变化时，返回检查并迭代。</text><text x="450" y="420" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">功能相互联系，可按情境进入与裁剪。</text><text x="450" y="490" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">自愿框架；图示不是固定顺序、认证或法律合规证明。</text></g></svg>