<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="690px" viewBox="0 0 900 690" role="img" aria-labelledby="title desc"><title id="title">图10-3 技术方案的受影响者与责任范围</title><desc id="desc">从中心方案沿箭头追问谁使用、提供资料、被描述、批准或承受后果。比较“当前学生团队能决定的事项”与“需要授权主体确认的事项”，并留意受影响者与决定者可能不是同一群体。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="690" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="450" y="26" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#202326">箭头提示接触或影响关系，需要调查确认。</text><rect x="315" y="250" width="270" height="115" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">数字展技术方案</text><text x="450.0" y="316" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">当前学生原型</text><text x="450.0" y="344" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">设计、数据与输出</text><rect x="15" y="55" width="270" height="90" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="150.0" y="89" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">直接使用者</text><text x="150.0" y="121" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">怎样接触与使用</text><rect x="615" y="55" width="270" height="90" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="750.0" y="89" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">被描述或分类者</text><text x="750.0" y="121" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">是否知情、能否纠正</text><rect x="15" y="250" width="270" height="90" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="150.0" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">资料或故事提供者</text><text x="150.0" y="316" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">提供范围与使用条件</text><rect x="615" y="250" width="270" height="90" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="750.0" y="284" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">团队成员</text><text x="750.0" y="316" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">执行、协作与负担</text><rect x="15" y="445" width="270" height="90" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="150.0" y="479" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">课程或组织授权方</text><text x="150.0" y="511" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">确认许可与公开范围</text><rect x="615" y="445" width="270" height="90" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="750.0" y="479" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">更广泛的公众</text><text x="750.0" y="511" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">间接后果与公共影响</text><line x1="150" y1="150" x2="310" y2="260" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="750" y1="150" x2="590" y2="260" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="290" y1="295" x2="310" y2="295" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="590" y1="315" x2="610" y2="315" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="150" y1="440" x2="310" y2="355" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="590" y1="355" x2="750" y2="440" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="25" y="580" width="400" height="72" rx="8" fill="#F0F2F4" stroke="#1F4E79" stroke-width="2"/><text x="225" y="610" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#202326">团队当前可决定</text><text x="225" y="640" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">获准范围内的设计与记录</text><rect x="475" y="580" width="400" height="72" rx="8" fill="#FFFFFF" stroke="#555B61" stroke-width="2" stroke-dasharray="7 6"/><text x="675" y="610" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="23px" font-weight="bold" fill="#202326">须由授权主体确认</text><text x="675" y="640" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">许可、公开范围与敏感事项</text></g></svg>