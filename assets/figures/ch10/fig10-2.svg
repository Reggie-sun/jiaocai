<svg xmlns="http://www.w3.org/2000/svg" width="900px" height="470px" viewBox="0 0 900 470" role="img" aria-labelledby="title desc"><title id="title">图10-2 目标、容量与公平性共同约束的任务分配</title><desc id="desc">先确认本轮目标和边界，再看工作包、技能、可用容量、学习机会与风险，之后明确责任并依据实际用时、反馈和风险证据调整。不要把人数、卡片数或估算总时数相同直接当作公平结论。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker><pattern id="teaching" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#F0F2F4"/><path d="M0 10 L10 0" stroke="#1F4E79" stroke-width="2"/></pattern><pattern id="extra" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#FFFFFF"/><path d="M0 10 L10 0 M0 0 L10 10" stroke="#555B61" stroke-width="2"/></pattern></defs><rect width="900" height="470" fill="#FFFFFF"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="450" y="24" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">公平性与容量需要共同检查，熟练程度不是唯一依据。</text><rect x="30" y="40" width="260" height="115" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="160.0" y="74" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">目标与边界</text><text x="160.0" y="106" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">本轮要达成什么</text><rect x="320" y="40" width="260" height="115" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="74" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">工作包与估时</text><text x="450.0" y="106" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">依赖与工作量</text><rect x="610" y="40" width="260" height="115" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="740.0" y="74" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">联合检查条件</text><text x="740.0" y="106" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">技能 / 可用容量</text><text x="740.0" y="134" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">学习机会 / 风险</text><rect x="30" y="240" width="260" height="115" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="160.0" y="274" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">责任分配与交接</text><text x="160.0" y="306" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">共同确认接收条件</text><rect x="320" y="240" width="260" height="115" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="450.0" y="274" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">实际负担与反馈</text><text x="450.0" y="306" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">用时、表现与风险</text><rect x="610" y="240" width="260" height="115" rx="8" fill="#FFFFFF" stroke="#1F4E79" stroke-width="2"/><text x="740.0" y="274" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="24px" font-weight="bold" fill="#1F4E79">维持或调整</text><text x="740.0" y="306" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="normal" fill="#202326">缩小或重新分配</text><line x1="295" y1="97" x2="315" y2="97" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="585" y1="97" x2="605" y2="97" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M740 162 V194 H160 V233" fill="none" stroke="#555B61" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><line x1="295" y1="297" x2="315" y2="297" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="585" y1="297" x2="605" y2="297" stroke="#555B61" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M740 362 V400 H12 V97 H25" fill="none" stroke="#555B61" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="450" y="440" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="22px" font-weight="bold" fill="#202326">反馈返回目标与容量；分配结果仍需实际执行和复核。</text></g></svg>